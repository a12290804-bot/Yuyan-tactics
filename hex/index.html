<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120f0d">
<title>渡鴉下潛</title>
<style>
:root{--bg:#120f0d;--panel:#1d1814;--line:#56452f;--gold:#d8b46a;--ink:#ecdfc9;--dim:#9a8c76;--red:#c65a4a;--blue:#6fb1e0;--pact:#c0415a;--inkc:#8fa7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;overflow:hidden}
button{font:inherit;color:var(--ink);background:#2a221b;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
button.main{background:#5a4426;border-color:var(--gold);color:#fff3d6}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.bg{position:absolute;inset:0;background:center/cover no-repeat;z-index:-1;opacity:.35;filter:saturate(.7)}
.bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;background:linear-gradient(#120f0df0,#120f0d90);flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;padding:2px 9px;border:1px solid var(--line);border-radius:14px;background:#0009;font-size:14px}
.pill img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.hpbar{position:relative;height:9px;background:#3a1a16;border-radius:5px;overflow:hidden;border:1px solid #0008}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e0614c,#9d2f22);transition:width .3s}
.relics{display:flex;gap:4px;flex-wrap:wrap}
.relics img{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:#000}
/* 標題 */
#title{align-items:center;justify-content:flex-end;padding:0 20px calc(env(safe-area-inset-bottom) + 40px);text-align:center}
#title .bg{opacity:.55}
#title h1{font-size:40px;letter-spacing:10px;margin:0;color:#f1e2c2;text-shadow:0 2px 14px #000}
#title p{color:var(--dim);margin:8px 0 22px;line-height:1.7}
#title .btns{display:flex;flex-direction:column;gap:10px;width:min(280px,80vw)}
/* 選角 */
#pick .list{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;gap:12px;background:#1d1814e8;border:1px solid var(--line);border-radius:12px;padding:10px;align-items:center}
.ch img{width:96px;height:132px;object-fit:cover;object-position:50% 12%;border-radius:8px;flex:0 0 auto}
.ch .lamp{width:96px;height:132px;border-radius:8px;flex:0 0 auto;background:radial-gradient(circle at 50% 42%,#f6d27d 0,#a76b2a 14%,#2a1c12 46%,#0c0907 75%);display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:#c9b48d;padding-bottom:6px;position:relative;overflow:hidden}
.ch .lamp:after{content:"";position:absolute;left:50%;top:18%;width:22px;height:46px;margin-left:-11px;border:2px solid #4b3a25;border-radius:6px 6px 10px 10px;box-shadow:0 0 30px 10px #f6c86655}
.ch .relics img{width:28px;height:28px;object-position:50% 50%;border-radius:6px}
.ch h3{margin:0;color:var(--gold)}.ch small{color:var(--dim)}
.ch p{margin:6px 0;font-size:14px;line-height:1.6}
/* 對話 */
#talk{position:fixed;inset:0;z-index:60;display:none;background:#0d0b09 center/cover no-repeat}
#talk:before{content:'';position:absolute;inset:0;background:linear-gradient(#0d0b09cc,#0d0b0966 40%,#0d0b09ee)}
#talk.on{display:block}
#talk .por{position:absolute;bottom:150px;width:min(52vw,360px);max-height:62vh;object-fit:contain;object-position:50% 100%;transition:filter .25s,transform .25s;-webkit-mask-image:linear-gradient(to top,transparent,#000 24%,#000 86%,transparent),linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to top,transparent,#000 24%,#000 86%,transparent),linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);mask-composite:intersect}
#talk .por.l{left:-2vw}#talk .por.r{right:-2vw}
#talk .por.dim{filter:brightness(.4);transform:scale(.95)}
#talk .lampP{position:absolute;bottom:170px;right:4vw;width:min(40vw,240px);height:min(50vh,340px);border-radius:50%;background:radial-gradient(circle at 50% 40%,#f6d27d 0,#a76b2a 10%,#2a1c1200 55%);transition:opacity .25s}
#talk .box{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 16px);min-height:120px;background:#1d1814f2;border:1px solid var(--gold);border-radius:12px;padding:12px 14px}
#talk .who{color:var(--gold);font-size:15px;margin-bottom:6px}
#talk .say{font-size:17px;line-height:1.7}
#talk .tap{position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--dim)}
/* 地圖 */
#map .wrap{flex:1;overflow:auto;padding:6px 0 30px}
#map svg{display:block;margin:0 auto}
.node{cursor:pointer}
.node circle.bg2{fill:#1d1814;stroke:var(--line);stroke-width:2}
.node.can circle.bg2{stroke:var(--gold);stroke-width:3;animation:pul 1.4s infinite}
.node.done{opacity:.45}
.node.here circle.bg2{stroke:#fff;stroke-width:3}
@keyframes pul{50%{stroke-opacity:.35}}
.lg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--dim);padding:4px 10px}
.lg span{display:flex;align-items:center;gap:3px}.lg img{width:16px;height:16px;border-radius:50%}
/* 戰鬥 */
#cb .foes{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:8px 6px 0;min-height:0}
.foe{flex:1;max-width:46vw;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .15s}
.foe .art{width:100%;max-height:30vh;aspect-ratio:3/4;object-fit:cover;object-position:50% 25%;border-radius:10px;border:2px solid #0000;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 55%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 45%,#000 55%,transparent 80%)}
.foe.tgt .art{border-color:var(--red);animation:pul2 1s infinite}
@keyframes pul2{50%{filter:brightness(1.35)}}
.foe .nm{font-size:13px;margin-top:2px;text-align:center}
.foe .hpbar{width:90%;margin-top:3px}
.foe .hpt{font-size:11px;color:var(--dim)}
.intent{position:absolute;z-index:3;top:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:#000c;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:14px;white-space:nowrap}
.intent img{width:18px;height:18px;border-radius:50%}
.intent.atk{border-color:var(--red);color:#ffb3a6}
.sts{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px;min-height:18px}
.sts span{display:flex;align-items:center;font-size:11px;background:#0009;border-radius:8px;padding:0 4px 0 1px}
.sts img{width:15px;height:15px;border-radius:50%}
.blk{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:12px}
.foe.dead{opacity:0;transform:scale(.8);transition:all .5s;pointer-events:none}
.shake{animation:shk .3s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fxi{position:absolute;left:50%;top:35%;width:80%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;animation:fxa .55s ease-out forwards}
@keyframes fxa{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.num{position:absolute;left:50%;top:30%;font-size:26px;font-weight:bold;color:#ffd7c9;text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:none;animation:numa .9s ease-out forwards;z-index:5}
.num.b{color:#a9d8ff}.num.h{color:#9fe8a3}.num.p{color:#ff7a90}
@keyframes numa{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-48px)}}
#me{display:flex;align-items:center;gap:10px;padding:6px 12px;position:relative}
#me .orb{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe7a8,#c8892d 55%,#5a3a10);display:flex;align-items:center;justify-content:center;font-size:20px;color:#2a1a05;font-weight:bold;box-shadow:0 0 14px #e9b44a88;flex:0 0 auto}
#me .info{flex:1;min-width:0}
#me .row{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.inkb{color:var(--inkc)}
#hand{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 6px;min-height:178px;align-items:flex-end;scroll-snap-type:x proximity}
.card{flex:0 0 auto;width:112px;height:162px;border-radius:10px;background:#211a14;border:2px solid #6b5537;position:relative;overflow:hidden;transition:transform .15s;scroll-snap-align:center;box-shadow:0 3px 8px #0008}
.card.a{border-color:#9c4a3c}.card.s{border-color:#3f6a8f}.card.p{border-color:#8a6ab0}.card.x{border-color:#444;filter:grayscale(1)}
.card.ch_yy{background:linear-gradient(#2a1418,#1d1214)}.card.ch_cl{background:linear-gradient(#1a1a22,#16140f)}.card.ch_any{background:linear-gradient(#202022,#18171a)}
.card.r1{box-shadow:0 3px 8px #0008,inset 0 0 0 1px #c0c0c055}.card.r2{box-shadow:0 3px 8px #0008,inset 0 0 0 1px #c0c0c088,inset 0 0 0 3px #0006,inset 0 0 0 4px #c0c0c044}.card.r3{box-shadow:0 0 12px #e8c46a77,inset 0 0 0 1px #e8c46a99}
.card.ch_yy .cn{background:#3a0f1888}.card.ch_cl .cn{background:#1a160888}
.card.taxed .cc{background:#d06a4a;color:#fff}
.card .ci{position:absolute;left:0;right:0;top:0;height:74px;background:center/cover no-repeat}
.card .cc{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#e4b75e;color:#2a1a05;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid #1d1408}
.card .cn{position:absolute;left:0;right:0;top:74px;text-align:center;font-size:13px;padding:2px;background:#0008;color:#f3e3c2}
.card .cn.up{color:#9fe8a3}
.card .cd{position:absolute;left:5px;right:5px;top:96px;bottom:4px;font-size:10.5px;line-height:1.35;color:#d9ccb4;overflow:hidden}
.card.sel{transform:translateY(-14px);border-color:#fff;box-shadow:0 0 16px #ffe7a8aa}
.card.no{opacity:.55}
#hand .card.no .cc{background:#7a6a55}
#cbtm{display:flex;align-items:center;gap:8px;padding:4px 10px calc(env(safe-area-inset-bottom) + 8px)}
#cbtm .pile{font-size:12px;color:var(--dim)}
#cbtm .grow{flex:1}
#detail{position:fixed;left:50%;bottom:196px;transform:translateX(-50%);width:min(92vw,380px);background:#1d1814f4;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;z-index:30;display:none}
#detail.on{display:block}
#detail h4{margin:0 0 4px;color:var(--gold)}#detail p{margin:0 0 8px;font-size:14px;line-height:1.6}
#hint{position:fixed;left:50%;top:44%;transform:translateX(-50%);background:#000c;border:1px solid var(--red);color:#ffcdbf;padding:6px 14px;border-radius:16px;z-index:25;display:none;font-size:14px}
#turnBan{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:26px;letter-spacing:6px;color:#f3e3c2;text-shadow:0 0 12px #000;z-index:40;pointer-events:none;opacity:0}
#turnBan.go{animation:ban 1s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(.9)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
/* 通用面板 */
.page{flex:1;overflow:auto;padding:12px 14px calc(env(safe-area-inset-bottom) + 20px)}
.page h2{color:var(--gold);margin:6px 0 10px}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cards .card{cursor:pointer}
.price{display:block;text-align:center;font-size:13px;margin-top:3px;color:var(--gold)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;line-height:1.5}
.opt small{display:block;color:var(--dim);font-size:13px}
.big{font-size:17px;line-height:1.8}
.rel{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:#0006}
.rel img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.rel b{color:var(--gold);font-weight:normal}.rel small{display:block;color:var(--dim);font-size:13px;line-height:1.5}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 60px);left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92vw}
.toast{background:#1d1814f2;border:1px solid var(--gold);border-radius:12px;padding:8px 14px;font-size:14px;animation:tin 3s ease forwards;text-align:center}
.toast b{color:var(--gold);font-weight:normal}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.codex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.codex div{text-align:center;font-size:12px;color:var(--dim)}
.codex img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.codex .no img{filter:brightness(0) contrast(.5);opacity:.5}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2e261e}
.ach i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--gold)}
.ach.got i{background:#5a4426;border-color:var(--gold)}
.ach small{display:block;color:var(--dim)}
.modal{position:fixed;inset:0;background:#000b;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:14px;max-width:460px;width:100%;max-height:84vh;overflow:auto}
</style>
</head>
<body>
<!-- 標題 -->
<section id="title" class="scr on"><div class="bg" id="tbg"></div>
 <h1>渡鴉下潛</h1>
 <p>天闕市的底下，一層比一層深。<br>提著燈，往下走。</p>
 <div class="btns">
  <button class="main" id="bCont" onclick="contRun()">繼續這一局</button>
  <button class="main" onclick="show('pick')">開始下潛</button>
  <button onclick="openBook()">回憶之書</button>
  <button onclick="openCodex()">圖鑑</button>
  <button onclick="openAch()">成就</button>
  <button onclick="soundMenu()">聲音</button>
  <button onclick="showNotes()">公告</button>
 </div>
 <p id="tmem" style="margin-top:14px;font-size:13px"></p>
 <p style="margin:0;font-size:12px;color:var(--dim)"><span id="tver"></span>・紀錄只存在這台裝置</p>
</section>
<!-- 選角 -->
<section id="pick" class="scr"><div class="bg" id="pbg"></div>
 <div class="bar"><b style="color:var(--gold)">誰下去？</b><span style="flex:1"></span><button onclick="show('title')">返回</button></div>
 <div class="list" id="chlist"></div>
</section>
<!-- 地圖 -->
<section id="map" class="scr"><div class="bg" id="mbg"></div>
 <div class="bar" id="mbar"></div>
 <div class="lg" id="mlg"></div>
 <div class="wrap" id="mwrap"></div>
</section>
<!-- 戰鬥 -->
<section id="cb" class="scr"><div class="bg" id="cbg"></div>
 <div class="bar" id="cbar"></div>
 <div class="foes" id="foes"></div>
 <div id="me"></div>
 <div id="hand"></div>
 <div id="cbtm"><span class="pile" onclick="showPile('draw')" id="pDraw"></span><span class="pile" onclick="showPile('disc')" id="pDisc"></span><span class="grow"></span><button onclick="showDeck()">牌組</button><button class="main" id="bEnd" onclick="endTurn()">結束回合</button></div>
</section>
<!-- 一般頁面（獎勵、商店、營火、事件、寶箱、選牌、結算） -->
<section id="pg" class="scr"><div class="bg" id="gbg"></div><div class="bar" id="gbar"></div><div class="page" id="gpage"></div></section>
<!-- 回憶、圖鑑、成就 -->
<section id="book" class="scr"><div class="bg" id="bbg"></div><div class="bar"><b style="color:var(--gold)" id="btitle"></b><span style="flex:1"></span><button onclick="show('title')">返回</button></div><div class="page" id="bpage"></div></section>
<div id="detail"></div><div id="hint"></div><div id="turnBan"></div>
<div id="talk" onclick="talkNext()"></div>
<div class="modal" id="gate" style="z-index:90;background:#000"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<div id="toasts"></div>
<script>
// 渡鴉下潛（肉鴿卡牌試作）—— 資料
(function(root){
const I='../../raven-guild/images/';
const sk=n=>I+'sk_'+n+'.webp',m=n=>I+'m_'+n+'.webp';
const DATA={
 version:'v0.3',
 title:'渡鴉下潛',
 img:I,
 // ── 角色
 chars:{
  yy:{name:'語嫣',title:'織命的長女',hp:80,img:I+'y_base.webp',ex:{smug:I+'y_ex_smug.webp',laugh:I+'y_ex_laugh.webp',pout:I+'y_ex_pout.webp',annoy:I+'y_ex_annoy.webp'},
   relic:'thread',deck:['strike','strike','strike','strike','guard','guard','guard','guard','yy_bind','yy_reel'],
   desc:'把「厄契」纏在敵人身上：牠們每次出手都會被反噬，最後再一口氣裁定。',
   line:'呵呵……下面的東西，可沒有一個懂得守約呢。'},
  cl:{name:'克勞德',title:'渡鴉的女兒・守燈人',hp:76,img:null,
   relic:'quill',deck:['strike','strike','strike','strike','guard','guard','guard','guard','cl_pen','cl_stroke'],
   desc:'一邊守一邊記下「墨」，等時機到了，一筆落下。',
   line:'燈我提著。姐姐，別走太快。'}
 },
 // ── 狀態
 status:{
  vuln:{name:'易傷',ic:I+'st_vuln.webp',desc:'受到的傷害增加 50%。每回合減 1。'},
  weak:{name:'虛弱',ic:I+'st_weak.webp',desc:'造成的傷害減少 25%。每回合減 1。'},
  str:{name:'力量',ic:I+'st_might.webp',desc:'每次攻擊多造成這麼多傷害。'},
  dex:{name:'敏捷',ic:I+'st_wall.webp',desc:'每次獲得格擋多這麼多。'},
  pact:{name:'厄契',ic:I+'st_curse.webp',desc:'出手攻擊時，自己受到等同層數的反噬。不會自己消失。'},
  link:{name:'命線',ic:I+'st_link.webp',desc:'被命線連著的敵人受到傷害時，其他連著的敵人也受到一半。'},
  ink:{name:'墨',ic:I+'st_echo.webp',desc:'克勞德記下的墨。「落筆」類的牌會用掉全部的墨，變得更強。'},
  regen:{name:'回生',ic:I+'st_regen.webp',desc:'回合結束時回復生命，每回合減 1。'}
 },
 powers:{
  pactTurn:'每回合開始，所有敵人獲得 {n} 層厄契。',
  pactThorn:'被攻擊時，攻擊你的敵人獲得 {n} 層厄契。',
  inkTurn:'每回合開始，獲得 {n} 墨。',
  inkBlock:'每次獲得墨，同時獲得 {n} 格擋。',
  drawTurn:'每回合多抽 {n} 張牌。',
  strTurn:'每回合開始，獲得 {n} 力量。',
  linkFull:'命線分攤的傷害從一半變成全額。',
  keepInk:'回合結束時，每有 1 張保留在手上的牌，獲得 {n} 墨。'
 },
 // ── 卡牌：c 費用、t 種類（a 攻擊 s 技能 p 能力 x 詛咒）、r 稀有度（0 起始 1 普通 2 罕見 3 稀有）
 // fx：['d',傷害,段數,加成] ['da',全體傷害,段數,加成] ['b',格擋] ['dr',抽] ['en',能量] ['st',狀態,層數,對象 t/a/s]
 //     ['pa',厄契,對象 t/a] ['ink',墨] ['jd',每層傷害] ['lk'] ['hp',回血] ['cp'] ['pw',能力,層數] ['px2'] ['rw'] ['ep',能量]

DATA.talk.boss={"wusign": {"yy": [["yy", "smug", "沒簽名就退回？那我簽給你看——用你的命線。"], ["cl", null, "姐姐，簽名要寫正楷喔。"]], "cl": [["cl", null, "我會一筆一筆寫清楚，誰才是要被退回的。"], ["yy", "laugh", "呵呵，妹妹寫字的時候最可怕了♡"]]}, "qianhao": {"yy": [["yy", "annoy", "吵死了。編號？我來幫你編。"], ["cl", null, "它好像只是想把東西送到對的地方……可惜方法錯了。"]], "cl": [["cl", null, "不管你把多少東西分錯，我都會把它們找回來。"], ["yy", "smug", "分錯的，就交給姐姐拆掉吧。"]]}, "deepdrill": {"yy": [["yy", "smug", "你挖得再深，也挖不斷我的線喔。"], ["cl", null, "姐姐，線拉緊一點。我在後面照著。"]], "cl": [["cl", null, "下面已經沒有路了。所以，就到這裡。"], ["yy", "pout", "……妹妹說到這裡，就是到這裡。聽見沒有？"]]}};
DATA.talk.meet={"stampbug": {"yy": ["yy", "smug", "呵呵，連蟲子都想在我身上蓋章？"], "cl": ["cl", null, "牠只會蓋「退件」兩個字……好可憐。"]}, "deadletters": {"yy": ["yy", "annoy", "一大疊沒人要的信，還敢黏過來。"], "cl": ["cl", null, "它們是在找收件人吧。對不起，不是我。"]}, "returndog": {"yy": ["yy", "pout", "狗就該乖乖待在走廊上。"], "cl": ["cl", null, "牠只是在做牠的工作。可是，我還不能被退回去。"]}, "lackcrow": {"yy": ["yy", "smug", "少了字的紙鴉？那我幫你補上「輸」。"], "cl": ["cl", null, "牠缺的那個字……我好像在哪裡看過。"]}, "dutyghost": {"yy": ["yy", "annoy", "下班時間早過了吧？"], "cl": ["cl", null, "他還在等交班的人。我們幫他敲最後一次鐘。"]}, "paper": {"yy": ["yy", "laugh", "做得真好看。可惜擋到我的路了♡"], "cl": ["cl", null, "紙做的身體，摺痕很整齊。做它的人一定很用心。"]}, "foxlamp": {"yy": ["yy", "smug", "戴狐狸面具在我面前提燈？膽子不小呢。"], "cl": ["cl", null, "它的燈跟我的不一樣，照的是回不去的路。"]}, "widow": {"yy": ["yy", "pout", "一直剪燈芯，是想讓大家都看不見嗎？"], "cl": ["cl", null, "不可以剪。這盞燈，我要提著回家。"]}, "talis": {"yy": ["yy", "annoy", "符貼歪了。我最討厭不整齊的東西。"], "cl": ["cl", null, "符上的字被雨淋糊了，難怪它停不下來。"]}, "rustrat": {"yy": ["yy", "annoy", "一群一群的，煩死了。"], "cl": ["cl", null, "牠們在啃鐵軌……再啃下去，就沒有路能回去了。"]}, "whiteminer": {"yy": ["yy", "smug", "影子也想挖礦？先問問我的線答不答應。"], "cl": ["cl", null, "他還在找他沒挖完的那條礦脈。"]}, "minecart": {"yy": ["yy", "laugh", "坐車不用買票嗎？呵呵……"], "cl": ["cl", null, "車上的人看不清楚臉……我們先讓它停下來。"]}, "envelope": {"yy": ["yy", "smug", "信封裡還有信封？呵呵，拆到最後是什麼呢。"], "cl": ["cl", null, "拆開一層，又多一封……要一封一封讀完才行。"]}, "slip": {"yy": ["yy", "annoy", "一張便條也敢擋路。"], "cl": ["cl", null, "上面寫著「記得回來」。……是寫給誰的呢。"]}, "postage": {"yy": ["yy", "pout", "什麼都要加錢，真小氣。"], "cl": ["cl", null, "郵資不夠的話，我們就慢慢付。可是不能被扣在這裡。"]}, "papercopy": {"yy": ["yy", "smug", "剪得跟真的一樣？可惜，世界上只有一個我。"], "cl": ["cl", null, "剪下來的影子……原本的那個人，一定很捨不得它吧。"]}, "magpie": {"yy": ["yy", "annoy", "敢偷妹妹的燈？你完了。"], "cl": ["cl", null, "牠喜歡會發光的東西。對不起，這盞不能給你。"]}, "matchmaker": {"yy": ["yy", "annoy", "我的線，不准你解。"], "cl": ["cl", null, "她想把線都剪斷，再重新綁一次。姐姐，小心。"]}, "slagslime": {"yy": ["yy", "pout", "黏黏的……不要碰到我的裙子。"], "cl": ["cl", null, "礦渣聚在一起，就變成會動的東西了。"]}, "debtlamp": {"yy": ["yy", "smug", "欠帳的燈？呵呵，帳要找本人算。"], "cl": ["cl", null, "它在吸我的墨……我會記住，記得比它吸得快。"]}, "foreman": {"yy": ["yy", "annoy", "一直吹哨，吵死了。"], "cl": ["cl", null, "哨子還在催大家上工。可是已經沒有人要下來了。"]}};
DATA.talk.winMore={"yy": [[["yy", "smug", "下面的東西都很守規矩了。我教的。"], ["cl", null, "姐姐，妳衣服上沾了紙屑。……我幫妳拍掉。"]], [["yy", "laugh", "妹妹，燈還亮著吧？"], ["cl", null, "一直都亮著。我說過會等妳的。"]]], "cl": [[["cl", null, "姐姐，我把今天的路都記下來了。"], ["yy", "smug", "哼，記那麼多做什麼？……好啦，晚點唸給我聽。"]], [["cl", null, "燈芯還剩很多。下次可以走更遠。"], ["yy", "pout", "下次換我。妹妹別想一個人搶著去。"]]]};

DATA.talk.rest=[[["yy", "smug", "妹妹，火太小了。"], ["cl", null, "剛剛好。太大的話，會把下面的東西都引過來。"], ["yy", "pout", "……妳每次都有道理。"], ["cl", null, "因為姐姐每次都會問。"]], [["cl", null, "姐姐，妳覺得爸爸現在在做什麼？"], ["yy", "smug", "一定是在擔心我們。"], ["cl", null, "還有呢？"], ["yy", "laugh", "還有在想晚餐要煮什麼♡"], ["cl", null, "……那我們要早點回去。"]], [["yy", null, "妳的羽筆，借我看看。"], ["cl", null, "可以。不過不要寫在我的手上。"], ["yy", "laugh", "呵呵，我才不會……寫一個小字就好。"], ["cl", null, "姐姐！"]], [["cl", null, "我今天在牆上看到一個名字，被劃掉了一半。"], ["yy", null, "會害怕嗎？"], ["cl", null, "有一點。可是我把剩下的一半記下來了。"], ["yy", "smug", "那它就不算消失。妳記著，我纏著，誰都帶不走。"]], [["yy", "pout", "腳好酸。"], ["cl", null, "我幫妳揉。"], ["yy", "smug", "……就一下下喔。"], ["cl", null, "嗯，就一下下。"]]];
Object.assign(DATA.stories,{"story4": {"n": "晚餐的順序", "lines": [["yy", "smug", "爸爸今天煮了魚。我要吃中間那塊。"], ["cl", null, "那我吃尾巴。"], ["yy", "pout", "……為什麼妳都不跟我搶？"], ["cl", null, "因為姐姐吃到想吃的，會笑。"], ["yy", "annoy", "笨蛋。"], ["yy", null, "……尾巴給我一半。我也想吃。"], ["cl", null, "好。"]]}, "story5": {"n": "公會的門", "lines": [["cl", null, "第一次走進公會，我以為裡面會坐著一個很大的人。"], ["yy", "smug", "結果呢？"], ["cl", null, "結果只有一張很長的桌子，和很多張委託單。"], ["yy", null, "公會本來就沒有誰坐在最上面。大家接自己想接的事。"], ["cl", null, "那我們接的，都是往下的委託。"], ["yy", "laugh", "呵呵，因為下面的東西最需要有人去看看呀。"]]}, "story6": {"n": "提燈的意義", "lines": [["yy", null, "妹妹，妳的燈又不夠亮，照不了多遠。"], ["cl", null, "嗯。它只照得到腳邊。"], ["yy", "pout", "那提著做什麼？"], ["cl", null, "讓走在後面的人知道，前面有人。"], ["yy", null, "……"], ["yy", "smug", "那我走在妳旁邊。這樣兩個人都看得到。"]]}, "story7": {"n": "打結", "lines": [["cl", null, "姐姐，妳的線打結了。"], ["yy", "annoy", "我知道。不准看。"], ["cl", null, "我幫妳解。"], ["yy", "pout", "……解得開嗎？"], ["cl", null, "解不開也沒關係。打了結的地方，比較不會斷。"], ["yy", "laugh", "呵呵，這句是爸爸說的吧。"], ["cl", null, "被妳發現了。"]]}, "story8": {"n": "回到地面的那天", "lines": [["yy", null, "最上面那一階，總是最難爬。"], ["cl", null, "因為快到了，反而會想起下面看過的東西。"], ["yy", "smug", "妳想起什麼？"], ["cl", null, "想起每一次回頭，姐姐都在。"], ["yy", "pout", "……不要突然說這種話。"], ["cl", null, "那我寫下來，回去再給妳看。"], ["yy", "laugh", "呵呵……那我要第一個看♡"]]}});

DATA.codex={"stampbug": "退件印章蟲：在退件局的抽屜裡出生，一輩子只會蓋同一個章。", "deadletters": "死信群：沒人收的信會自己聚在一起，往有光的地方爬。", "returndog": "巡廊退件犬：把走廊上的每樣東西都叼回原處，包括走錯路的人。", "lackcrow": "缺字紙鴉：用寫錯的信紙摺成，一直在找自己少掉的那個字。", "dutyghost": "停擺的值班員：交班的人一直沒來，他就一直值班到現在。", "moth": "書霧螟：喜歡停在沒人讀的書上，翅膀的鱗粉會讓人看不清字。", "mailbox": "倒懸郵筒怪：掛在天花板上的郵筒。投進去的東西，從來沒有寄出去過。", "scribe": "無名抄行者：抄過太多別人的名字，忘了自己的。", "paper": "紙紮人：做得太像真的，忘了自己是要被送走的。", "paperdoll": "紙偶：線的另一頭沒有人拉，它還是照著學過的動作在跳。", "talis": "符屍：額上的符被雨淋糊了，沒人知道原本寫的是「停」還是「走」。", "foxlamp": "狐面提燈者：它提的燈只照往回走的路。", "widow": "燈芯寡婦：一根一根剪掉別人的燈芯，好讓自己的燈看起來最亮。", "hyena": "漏頁鬣犬：專吃書裡掉出來的那一頁，所以很多故事都缺了中間。", "wgod": "游神：紙紮巷的巡境者，香火越旺，腳步越重。", "chorus": "舊戶籍合唱體：被註銷的名字聚在一起，每天準時點一次名。", "rustrat": "鏽齒鼠群：啃鐵軌的聲音，是白鐵礦坑裡最常聽到的雨聲。", "rustlung": "鏽肺：礦坑在呼吸。每吸一口氣，空氣就更紅一點。", "leech": "管線水蛭：住在漏水的管線裡，什麼溫熱的東西都想貼上去。", "whiteminer": "白鐵礦工的影子：礦工早就上去了，影子還留在下面揮著鎬。", "minecart": "載著人的礦車：車上的人一直說「快到了」，礦車就一直往下開。", "valvehound": "氣閥獵犬：聽到洩壓的聲音就會衝過去，不管那是不是氣閥。", "skel": "鎖鏈骷髏守衛：守著一扇早就不存在的門，鑰匙還掛在腰上。", "giant": "燭苔巨人：身上長滿了點著小火的苔蘚，走過的地方會暖一點點。", "wusign": "退件執事・無簽：退件局的主人。沒有簽名的東西，他一律退回。", "qianhao": "總分揀機・千號：把所有東西分成一千類，唯獨分不出自己是哪一類。", "deepdrill": "掘進機・深挖：從來沒有人叫它停，所以它從來沒有停過。", "envelope": "雙層信封：裡面還套著一封信。拆開以後，總是比原本多一封。", "slip": "便條：從某個人的口袋掉出來，上面的字只剩下一半。", "postage": "欠資郵差：寄出的每一樣東西，他都說郵資不夠。", "papercopy": "剪紙替身：照著別人的影子剪出來，剪得越多，越分不出誰是誰。", "magpie": "偷燈喜鵲：把所有會發光的東西叼回巢裡，巢一直都很亮。", "matchmaker": "紙媒婆：見到線就要重新牽一次，從來不問線的主人願不願意。", "slagslime": "礦渣團：挖出來沒人要的碎石聚在一起，學會了自己滾動。", "debtlamp": "欠帳礦燈：礦工借了光沒有還，燈就一直跟著來討。", "foreman": "工頭的哨子：工頭不在了，哨子還掛在牆上，每到整點自己響起來。"};

命）", "r": [{"hurt": 8}, {"gold": 60}], "d": "失去 8 生命，得到 60 渡鴉幣"}, {"t": "拉下煞車", "r": [{"removePick": 1}], "d": "移除一張牌"}, {"t": "讓它過去", "r": [], "d": "離開"}]}, {"id": "echo", "n": "會回答的礦道", "img": "../../raven-guild/images/bg_ch4_echo.webp", "txt": "礦道深處有回聲，可是回來的話和喊出去的不太一樣。妳喊「有人嗎」，回來的是「有」。", "opts": [{"t": "喊「渡鴉」", "r": [{"upgradeRandom": 1}, {"maxhp": 3}], "d": "隨機升級一張牌，最大生命 +3"}, {"t": "喊自己的名字", "r": [{"transformPick": 1}], "d": "選一張牌，換成隨機的另一張"}]}]);
DATA.talk.boss={"wusign": {"yy": [["yy", "smug", "沒簽名就退回？呵呵……那我簽給你看，用你的命線當墨。"], ["cl", null, "姐姐，他的印台是紅的。別讓他蓋到妳。"]], "cl": [["cl", null, "你退回去的每一個人，我都會一個一個寫回來。"], ["yy", "laugh", "呵呵，妹妹認真起來，比這裡的東西都可怕呢♡"]]}, "qianhao": {"yy": [["yy", "annoy", "把人當包裹分類？品味真差。這筆帳，我替你記下了。"], ["cl", null, "它的格子裡有東西在敲……姐姐，裡面還有人在等。"]], "cl": [["cl", null, "不管你分錯多少個人，我都會把他們的名字找回來。"], ["yy", "smug", "妹妹找名字，我拆機器。分工剛好♡"]]}, "deepdrill": {"yy": [["yy", "smug", "挖了這麼久，餓了吧？呵呵……我也是。"], ["cl", null, "姐姐，妳的眼睛……先看著我。線拉緊一點，我在後面照著。"]], "cl": [["cl", null, "下面已經沒有路了，是你把它挖沒的。所以，就到這裡。"], ["yy", "pout", "……妹妹說到這裡，就是到這裡。聽見沒有，鐵罐頭？"]]}};
DATA.talk.meet={"stampbug": {"yy": ["yy", "smug", "連蟲子都想在我身上蓋章？蓋歪了，我可是會記仇的。"], "cl": ["cl", null, "牠蓋過的地方，紙都皺起來了……像皮膚一樣。"]}, "deadletters": {"yy": ["yy", "annoy", "一疊沒人要的信，還敢往我身上黏。"], "cl": ["cl", null, "它們在小聲唸收件人的地址。剛剛那個……是我們家。"]}, "returndog": {"yy": ["yy", "pout", "叼著別人的鞋到處跑？嘖，真沒教養。"], "cl": ["cl", null, "牠嘴裡那隻鞋還是濕的。對不起，我還不能被退回去。"]}, "lackcrow": {"yy": ["yy", "smug", "少了一個字？呵呵，我幫你補上，「死」字好不好？"], "cl": ["cl", null, "牠缺的那個字，我在牆上看過。被人用指甲刮掉了。"]}, "dutyghost": {"yy": ["yy", "annoy", "下班時間早過了吧？還是說，你已經沒有「下班」這回事了。"], "cl": ["cl", null, "他的錶停在三點十七分。交班的人……大概不會來了。"]}, "paper": {"yy": ["yy", "laugh", "呵呵……笑得真僵。要嚇人，至少先學會怎麼把嘴裂開吧？"], "cl": ["cl", null, "它的眼睛是畫上去的。可是剛剛，它眨了一下。"]}, "foxlamp": {"yy": ["yy", "smug", "戴狐狸面具在我面前提燈？面具底下那股味道，我聞得出來，是假的。"], "cl": ["cl", null, "它的燈只照往回走的路。姐姐，不要看那個方向。"]}, "widow": {"yy": ["yy", "pout", "剪別人的燈芯，好讓自己最亮？嘖，小家子氣。"], "cl": ["cl", null, "她的剪刀上纏滿了燒焦的燈芯。這盞，我不給。"]}, "talis": {"yy": ["yy", "annoy", "符貼歪了。我最討厭不整齊的東西，連死都死得不整齊。"], "cl": ["cl", null, "符底下的嘴一直在唸「停」，可是它的腳停不下來。"]}, "rustrat": {"yy": ["yy", "annoy", "一群一群的，吵死了。……妹妹，退後，牠們的牙是紅的。"], "cl": ["cl", null, "牠們在啃鐵軌。再啃下去，就沒有路能回家了。"]}, "whiteminer": {"yy": ["yy", "smug", "影子也想挖礦？我的影子可比你的有規矩多了……大概吧。"], "cl": ["cl", null, "他的影子在揮鎬，可是地上沒有拿鎬的人。"]}, "minecart": {"yy": ["yy", "laugh", "坐車不用買票嗎？呵呵……那就用別的東西付吧。"], "cl": ["cl", null, "車上的人一直說「快到了」，可是他們的臉都朝著後面。"]}, "envelope": {"yy": ["yy", "smug", "封口是濕的？呵呵……還是從裡面舔的。真沒禮貌。"], "cl": ["cl", null, "拆開一層，又多一封。裡面有東西在等我們拆到最後。"]}, "slip": {"yy": ["yy", "annoy", "一張撕下來的字條，也敢擋我的路。"], "cl": ["cl", null, "上面寫著「不要回頭」。字跡……是我的。"]}, "postage": {"yy": ["yy", "pout", "什麼都要加錢？呵呵，跟我談價錢，你還早得很。"], "cl": ["cl", null, "他說郵資不夠，要我們用別的東西補。……我不給。"]}, "papercopy": {"yy": ["yy", "annoy", "剪得跟我一樣？淚痣的位置都剪錯了，冒牌貨。"], "cl": ["cl", null, "它在學姐姐笑。可是姐姐笑的時候，嘴角不會兩邊一樣高。"]}, "magpie": {"yy": ["yy", "annoy", "敢把爪子伸向妹妹的眼睛？這筆帳，我會一根羽毛一根羽毛地算。"], "cl": ["cl", null, "牠的巢一閃一閃的。我不想知道，那些亮的是什麼。"]}, "matchmaker": {"yy": ["yy", "annoy", "想替我牽線？我的線，誰都不准碰。"], "cl": ["cl", null, "她手上的紅線，另一頭綁著的都不是活人。姐姐，別讓她靠近妳。"]}, "slagslime": {"yy": ["yy", "pout", "黏黏的，還在喘氣……不准碰到我的裙子。"], "cl": ["cl", null, "它一吸氣，坑道就跟著縮一下。它在學礦坑呼吸。"]}, "debtlamp": {"yy": ["yy", "smug", "吸墨？呵呵，欠帳要找本人算。這筆，我替妹妹記下了。"], "cl": ["cl", null, "它在吸我的墨……沒關係，我寫得比它吸得快。"]}, "foreman": {"yy": ["yy", "annoy", "沒有臉還敢對我吹哨？先長張臉再來。"], "cl": ["cl", null, "哨聲一響，牆裡就傳來很多人起身的聲音。可是這裡只有我們。"]}};
DATA.talk.winMore={"yy": [[["yy", "smug", "下面的東西都很守規矩了。我教的。"], ["cl", null, "姐姐，妳衣服上沾了紙灰，還有一點紅的。我幫妳擦掉。"]], [["yy", "laugh", "妹妹，燈還亮著吧？"], ["cl", null, "一直亮著。只是剛剛，妳的影子比妳先回來。"], ["yy", "smug", "呵呵……那它很乖，知道要先回家。"]]], "cl": [[["cl", null, "姐姐，今天的路我都記下來了。有幾段，寫的時候手在抖。"], ["yy", "smug", "記那麼多做什麼？……好啦，晚點唸給我聽。抖的那幾段跳過。"]], [["cl", null, "燈芯還剩很多，下次可以走更遠。"], ["yy", "pout", "下次換我走前面。妳的燈照到的東西，不准一個人看。"]]]};
DATA.talk.loseMore={"yy": [[["yy", "annoy", "……不是輸，是線太短了。"], ["cl", null, "嗯。斷掉的地方，我幫妳打了一個結。"]], [["yy", "pout", "妹妹，不准看我的眼睛。……還沒變回來。"], ["cl", null, "我不看。我只是很高興妳回來了。"]]], "cl": [[["cl", null, "燈熄了一下。黑暗裡有人叫我的名字……可是我知道，姐姐不會那樣叫我。"], ["yy", "smug", "當然。我叫妳的時候，一定會帶一點不耐煩。"]], [["cl", null, "姐姐，我是不是又讓妳擔心了？"], ["yy", "annoy", "是。所以明天我陪妳下去。誰敢碰妳，這筆帳我會連本帶利收回來。"]]]};
DATA.talk.rest=[[["yy", "smug", "妹妹，火太小了。"], ["cl", null, "剛剛好。太大的話，會把下面的東西引過來。"], ["yy", "pout", "……它們已經在火光外面坐了一圈了。"], ["cl", null, "嗯。所以我們小聲一點。"]], [["cl", null, "姐姐，妳覺得爸爸現在在做什麼？"], ["yy", "smug", "一定在擔心我們。"], ["cl", null, "還有呢？"], ["yy", "laugh", "還有在想晚餐要煮什麼♡"], ["cl", null, "……那我們要好好回去吃。"]], [["yy", null, "妳的羽筆，借我看看。"], ["cl", null, "可以。不過不要寫在我的手上。"], ["yy", "laugh", "呵呵，寫一個小字就好——"], ["cl", null, "姐姐。妳的影子剛剛先伸手了。"], ["yy", null, "……是嗎。那我們都別理它。"]], [["cl", null, "我今天在牆上看到一個名字，被劃掉了一半。"], ["yy", null, "會害怕嗎？"], ["cl", null, "有一點。剩下的那一半，是我的。"], ["yy", "smug", "那它就不算數。妳記著，我纏著，誰都劃不掉。"]], [["yy", "pout", "腳好酸。"], ["cl", null, "我幫妳揉。"], ["cl", null, "……姐姐，妳的流蘇是紅的。"], ["yy", null, "嗯？"], ["yy", "smug", "妳看錯了，是火光。"], ["cl", null, "……嗯。我看錯了。"]]];
DATA.talk.restW=[4,4,4,4,1];  // 第 5 段（流蘇變紅）出現得少
Object.assign(DATA.stories,{"story4": {"n": "晚餐的順序", "lines": [["yy", "smug", "渡鴉今天煮了魚。我要吃中間那塊。"], ["cl", null, "那我吃尾巴。"], ["yy", "pout", "……為什麼妳都不跟我搶？"], ["cl", null, "因為姐姐吃到想吃的，會笑。"], ["yy", null, "……妹妹，桌上為什麼擺了四副碗筷？"], ["cl", null, "我也不知道。我擺的時候，明明是三副。"], ["yy", "smug", "呵呵……那多出來的那副，誰都不准坐。尾巴給我一半。"], ["cl", null, "好。"]]}, "story5": {"n": "公會的門", "lines": [["cl", null, "第一次走進公會，我以為裡面會坐著一個很大的人。"], ["yy", "smug", "結果呢？"], ["cl", null, "只有一張很長的桌子，和很多張委託單。有些單子上的墨還沒乾，接的人卻沒有回來。"], ["yy", null, "公會本來就沒有誰坐在最上面。大家接自己想接的事，自己負責回來。"], ["cl", null, "那我們接的，都是往下的委託。"], ["yy", "laugh", "呵呵，因為下面的東西最需要有人去看看呀。……也最需要有人把門關好。"]]}, "story6": {"n": "提燈的意義", "lines": [["yy", null, "妹妹，妳的燈不夠亮，照不了多遠。"], ["cl", null, "嗯。它只照得到腳邊。"], ["yy", "pout", "那提著做什麼？"], ["cl", null, "讓走在後面的人知道，前面有人。"], ["yy", null, "如果跟在後面的，不是人呢？"], ["cl", null, "那它也會知道前面有人，而且不怕它。"], ["yy", "smug", "……那我走在妳旁邊。不管後面跟著什麼，都得先過我這關。"]]}, "story7": {"n": "打結", "lines": [["cl", null, "姐姐，妳的線打結了。"], ["yy", "annoy", "我知道。不准看。"], ["cl", null, "線在動……它自己在纏。"], ["yy", "pout", "它餓的時候就會這樣。……解得開嗎？"], ["cl", null, "解不開也沒關係。打了結的地方，比較不會斷。"], ["yy", "laugh", "呵呵，這句是渡鴉說的吧。"], ["cl", null, "被妳發現了。"]]}, "story8": {"n": "回到地面的那天", "lines": [["yy", null, "最上面那一階，總是最難爬。"], ["cl", null, "因為快到了，反而會想起下面看過的東西。"], ["yy", "smug", "妳想起什麼？"], ["cl", null, "想起每一次回頭，姐姐都在。……有一次回頭，有兩個姐姐。"], ["yy", null, "……哪一個在笑？"], ["cl", null, "兩個都在笑。可是我知道該牽哪一個。"], ["yy", "laugh", "呵呵……那當然。回去寫下來，我要第一個看♡"]]}});
DATA.codex={"stampbug": "退件印章蟲：在抽屜裡出生，一輩子只會蓋「退件」兩個字。被牠蓋過的地方，會慢慢變成紙。", "deadletters": "死信群：沒人收的信會聚在一起，往有體溫的地方爬。唸到收件人的名字時，它們會安靜下來。", "returndog": "巡廊退件犬：把走廊上的每樣東西叼回原處，包括走錯路的人。原處在哪裡，只有牠知道。", "lackcrow": "缺字紙鴉：用寫錯的信紙摺成，一直在找少掉的那個字。誰身上有，就啄誰。", "dutyghost": "停擺的值班員：交班的人一直沒來，他就一直值班。他胸前的名牌，寫的是下一個值班員的名字。", "moth": "書霧螟：停在沒人讀的書上。沾到鱗粉的人會先看不清字，再來是看不清自己的手。", "mailbox": "倒懸郵筒怪：掛在天花板上的郵筒。投進去的東西從來沒寄出去過，可是它一直很飽。", "scribe": "無名抄行者：抄過太多別人的名字，忘了自己的。牠抄到妳的名字時，請不要應聲。", "paper": "紙紮人：做得太像真的，忘了自己是要被燒掉的。它一直很努力地學人呼吸。", "paperdoll": "紙偶：線的另一頭沒有人拉，它還是照著學過的動作跳。仔細看，線是從它自己背後長出來的。", "talis": "符屍：額上的符被雨淋糊了，沒人知道原本寫的是「停」還是「走」。所以它兩個都在做。", "foxlamp": "狐面提燈者：它的燈只照往回走的路。跟著走的人，會在路的盡頭看見自己的背影。", "widow": "燈芯寡婦：一根一根剪掉別人的燈芯，好讓自己的燈最亮。她的燈其實早就滅了。", "hyena": "漏頁鬣犬：專吃書裡掉出來的那一頁，所以很多故事都缺了中間，只剩開頭和結局。", "wgod": "游神：紙紮巷的巡境者，香火越旺，腳步越重。祂在哪戶門口停下，那戶的燈就會熄。", "chorus": "舊戶籍合唱體：被註銷的名字聚在一起，每天準時點一次名。點到的人，要答「有」。", "rustrat": "鏽齒鼠群：啃鐵軌的聲音，是白鐵礦坑裡最常聽到的雨聲。雨停的時候，才要擔心。", "rustlung": "鏽肺：礦坑在呼吸。每吸一口，空氣就更紅一點；每吐一口，地上就多一層鐵屑。", "leech": "管線水蛭：住在漏水的管線裡，什麼溫熱的東西都想貼上去。被牠貼過的地方，會冷很久。", "whiteminer": "白鐵礦工的影子：礦工早就上去了，影子還留在下面揮鎬，一下一下，挖的坑剛好一個人大。", "minecart": "載著人的礦車：車上的人一直說「快到了」，礦車就一直往下開。沒有人記得要到哪裡。", "valvehound": "氣閥獵犬：聽到洩壓的聲音就會衝過去。人害怕時倒抽的那口氣，聽起來很像洩壓。", "skel": "鎖鏈骷髏守衛：守著一扇早就不存在的門，鑰匙還掛在腰上。不讓人過去，也不讓人回頭。", "giant": "燭苔巨人：身上長滿點著小火的苔蘚，走過的地方會暖一點。迷路的人都朝它走，然後成了新的苔。", "wusign": "退件執事・無簽：退件局的主人。沒有簽名的東西一律退回，包括沒在他簿子上簽過名的人。", "qianhao": "總分揀機・千號：把所有東西分成一千類，格子裡偶爾傳出敲打聲。唯獨分不出自己是哪一類。", "deepdrill": "掘進機・深挖：從來沒有人叫它停，所以它從來沒停過。駕駛座上有人，很久沒有動了。", "envelope": "舔過的信封：封口是濕的，不是漿糊，是有人舔過——從裡面。拆開以後，總是比原本多一封。", "slip": "撕下的字條：從某個人的口袋掉出來，字只剩一半。缺的那一半，會變成讀的人最怕看到的話。", "postage": "欠資的人：寄出的每一樣東西，他都說郵資不夠。補不上的部分，他會從寄件人身上收。", "papercopy": "剪出來的妳：照著別人的影子剪出來。剪得越多，越分不出誰是誰；剪到最後，留下來的是紙。", "magpie": "叼眼喜鵲：把所有會發光的東西叼回巢裡。牠的巢一直很亮，而且一直看著外面。", "matchmaker": "冥婚媒婆：見到線就要重新牽一次。另一頭綁的是誰，她從來不說，也從來不問線的主人願不願意。", "slagslime": "會呼吸的礦渣：沒人要的碎石聚在一起，學會了呼吸。現在，它在學怎麼像人一樣咳嗽。", "debtlamp": "吸墨礦燈：礦工借了光沒有還，燈就一直跟著來討。它討的不是油，是寫字的墨，還有寫字的人。", "foreman": "沒有臉的工頭：哨子還掛在他脖子上，每到整點自己響起來。底下的人一個都沒上來，他還在等點名。"};

 if(st.gold>=200)E.push({t:'ach',id:'gold200'});
 const rw={gold,cards:rollCards(D,st,3,kind!=='fight'),relic:null,relicChoice:null,cardTaken:false};
 if(kind==='elite'){const p=relicPool(D,st);if(p.length){rw.relic=pick(st,p);gainRelic(D,st,rw.relic);}}
 if(kind==='boss'){st.stats.bosses++;const bid=c.enemies[0].id;E.push({t:'ach',id:{wusign:'boss1',qianhao:'boss2',deepdrill:'boss3'}[bid]});
  const p=shuffle(st,relicPool(D,st)).slice(0,3);rw.relicChoice=p;st.hp=Math.min(st.maxHp,st.hp+Math.ceil((st.maxHp-st.hp)*.75));}
 if(st.relics.length>=6)E.push({t:'ach',id:'relic6'});
 st.reward=rw;st.combat=null;st.screen='reward';E.push({t:'win',kind,gold});}
function loseRun(D,st,E){st.screen='over';st.result={win:false};st.combat=null;E.push({t:'runEnd',win:false,ch:st.ch,floors:st.stats.floors,memory:memoryOf(D,st,false)});}
function memoryOf(D,st,win){const M=D.memory;return st.stats.floors*M.perFloor+st.stats.elites*M.perElite+st.stats.bosses*M.perBoss+(win?M.win:0);}

// ── 地圖
function canMove(D,st,c){const map=st.maps[st.layer];if(c==='boss')return st.row===D.map.rows-1;if(st.row===-1)return c>=0&&c<D.map.cols;if(st.row>=D.map.rows-1)return false;return map.rows[st.row][st.col].e.includes(c);}
function enter(D,st,c,E){const L=D.layers[st.layer];st.stats.floors++;
 if(c==='boss'){st.row=D.map.rows;startCombat(D,st,[L.boss],'boss').forEach(x=>E.push(x));E.push({t:'boss',id:L.boss});return;}
 st.row++;st.col=c;const t=st.maps[st.layer].rows[st.row][c].t;E.push({t:'enter',node:t});
 if(t==='fight'){const set=pick(st,L.fights);startCombat(D,st,set,'fight').forEach(x=>E.push(x));}
 else if(t==='elite'){startCombat(D,st,[pick(st,L.elites)],'elite').forEach(x=>E.push(x));}
 else if(t==='rest'){st.screen='rest';}
 else if(t==='chest'){const p=relicPool(D,st);const id=p.length?pick(st,p):null;if(id)gainRelic(D,st,id);else st.gold+=50;st.reward={chest:id,gold:id?0:50};st.screen='chest';if(st.relics.length>=6)E.push({t:'ach',id:'relic6'});}
 else if(t==='shop'){st.shop=genShop(D,st);st.screen='shop';}
 else if(t==='event'){let ev=D.events.filter(e=>!st.seenEv.includes(e.id));if(!ev.length){st.seenEv=[];ev=D.events;}const e=pick(st,ev);st.seenEv.push(e.id);st.event={id:e.id,done:null};if(has(st,'map'))st.gold+=15;st.screen='event';}}
function genShop(D,st){const P=D.shop;const cs=[];const p=pool(D,st);const used=new Set();for(let i=0;i<5;i++){const left=p.filter(k=>!used.has(k));if(!left.length)break;const id=pick(st,left);used.add(id);const r=D.cards[id].r;cs.push({id,price:Math.round(P.card[r-1]*(.9+R(st)*.2)),sold:false});}
 const rp=shuffle(st,relicPool(D,st)).slice(0,2).map(id=>({id,price:ri(st,P.relic[0],P.relic[1]),sold:false}));return {cards:cs,relics:rp,removed:false,removeCost:P.remove};}

function nextAfterBoss(D,st,E){st.layer++;if(st.layer>=D.layers.length){st.screen='over';st.result={win:true};E.push({t:'ach',id:'win_'+st.ch});E.push({t:'runEnd',win:true,ch:st.ch,floors:st.stats.floors,memory:memoryOf(D,st,true)});return;}
 st.row=-1;st.col=null;st.maps.push(genMap(D,st,st.layer));st.screen='map';E.push({t:'layer',n:st.layer});}
function backToMap(D,st,E){st.reward=null;st.event=null;st.shop=null;st.pick=null;if(st.row>=D.map.rows){nextAfterBoss(D,st,E);return;}st.screen='map';if(st.deck.length>=25)E.push({t:'ach',id:'deck25'});}

// ── 事件結果
function applyEvent(D,st,opt,E){const out=[];let pend=null;
 for(const r of opt.r){
  if(r.gold){st.gold=Math.max(0,st.gold+r.gold);}
  if(r.heal)st.hp=Math.min(st.maxHp,st.hp+r.heal);
  if(r.hurt){st.hp-=r.hurt;if(st.hp<=0)st.hp=1;}
  if(r.maxhp){st.maxHp=Math.max(1,st.maxHp+r.maxhp);st.hp=Math.min(st.hp,st.maxHp);}
  if(r.card){addCard(st,r.card);}
  if(r.relicRandom){const p=relicPool(D,st);if(p.length){const id=pick(st,p);gainRelic(D,st,id);out.push({relic:id});}}
  if(r.upgradeRandom)for(let k=0;k<r.upgradeRandom;k++){const up=st.deck.filter(c=>!c.up&&D.cards[c.id].u);if(up.length){const c=pick(st,up);c.up=1;out.push({upgraded:c.id});}}
  if(r.cardRare){const p=pool(D,st,3);if(p.length){const id=pick(st,p);addCard(st,id);out.push({card:id});}}
  if(r.cardPick)pend={mode:'choose',cards:rollCards(D,st,3,false)};
  if(r.removePick)pend={mode:'remove'};
  if(r.transformPick)pend={mode:'transform'};}
 return {out,pend};}

// ── 主要入口
function apply(D,st0,a){const st=clone(st0);const E=[];const fail=e=>({ok:false,error:e});
 if(st.screen==='over')return fail('這一局已經結束');
 switch(a.type){
  case 'MOVE':if(st.screen!=='map')return fail('現在不能移動');if(!canMove(D,st,a.c))return fail('走不到那裡');enter(D,st,a.c,E);break;
  case 'PLAY':{if(st.screen!=='combat')return fail('不在戰鬥中');const e=play(D,st,a.i,a.target,E);if(e)return fail(e);break;}
  case 'END_TURN':if(st.screen!=='combat')return fail('不在戰鬥中');endTurn(D,st,E);break;
  case 'PICK_CARD':{if(st.screen!=='reward'||st.reward.cardTaken)return fail('不能選');const id=st.reward.cards[a.i];if(!id)return fail('沒有這張');addCard(st,id);st.reward.cardTaken=true;E.push({t:'gotCard',id});break;}
  case 'SKIP_CARD':if(st.screen!=='reward')return fail('不能跳過');st.reward.cardTaken=true;break;
  case 'PICK_RELIC':{if(st.screen!=='reward'||!st.reward.relicChoice)return fail('不能選');const id=st.reward.relicChoice[a.i];if(!id)return fail('沒有這件');gainRelic(D,st,id);st.reward.relicChoice=null;st.reward.relicTaken=id;break;}
  case 'LEAVE':if(!['reward','chest','shop','event','rest'].includes(st.screen))return fail('不能離開');if(st.screen==='reward'&&st.reward.relicChoice)return fail('先選一件遺物');backToMap(D,st,E);break;
  case 'REST':if(st.screen!=='rest'||st.flags.rested)return fail('不能休息');{let n=Math.floor(st.maxHp*.3)+(has(st,'teapot')?15:0);if(has(st,'borrowedheart'))n=Math.floor(n/2);st.hp=Math.min(st.maxHp,st.hp+n);E.push({t:'heal',n});backToMap(D,st,E);}break;
  case 'SMITH':if(st.screen!=='rest')return fail('不能強化');{const c=st.deck.find(x=>x.uid===a.uid);if(!c||c.up||!D.cards[c.id].u)return fail('這張不能強化');c.up=1;E.push({t:'upgraded',id:c.id});backToMap(D,st,E);}break;
  case 'BUY_CARD':{if(st.screen!=='shop')return fail('不在商店');const it=st.shop.cards[a.i];if(!it||it.sold)return fail('賣完了');if(st.gold<it.price)return fail('渡鴉幣不夠');st.gold-=it.price;it.sold=true;addCard(st,it.id);E.push({t:'gotCard',id:it.id});break;}
  case 'BUY_RELIC':{if(st.screen!=='shop')return fail('不在商店');const it=st.shop.relics[a.i];if(!it||it.sold)return fail('賣完了');if(st.gold<it.price)return fail('渡鴉幣不夠');st.gold-=it.price;it.sold=true;gainRelic(D,st,it.id);if(st.relics.length>=6)E.push({t:'ach',id:'relic6'});break;}
  case 'REMOVE':{if(st.screen!=='shop'&&!(st.pick&&st.pick.mode==='remove'))return fail('不能移除');const i=st.deck.findIndex(x=>x.uid===a.uid);if(i>=0&&D.cards[st.deck[i].id].noRemove)return fail('這張牌不能被移除');if(i<0)return fail('沒有這張');
   if(st.screen==='shop'){if(st.shop.removed)return fail('這間店只能移除一次');if(st.gold<st.shop.removeCost)return fail('渡鴉幣不夠');st.gold-=st.shop.removeCost;st.shop.removed=true;st.shop.removeCost+=25;}
   else st.pick=null;st.deck.splice(i,1);E.push({t:'removed'});break;}
  case 'TRANSFORM':{if(!(st.pick&&st.pick.mode==='transform'))return fail('不能轉換');const c=st.deck.find(x=>x.uid===a.uid);if(!c)return fail('沒有這張');if(D.cards[c.id].noRemove)return fail('這張牌不能被換掉');const p=pool(D,st).filter(k=>k!==c.id);c.id=pick(st,p);c.up=0;st.pick=null;E.push({t:'transformed',id:c.id});break;}
  case 'CHOOSE':{if(!(st.pick&&st.pick.mode==='choose'))return fail('不能選');if(a.i!=null){const id=st.pick.cards[a.i];if(!id)return fail('沒有這張');addCard(st,id);E.push({t:'gotCard',id});}st.pick=null;break;}
  case 'EVENT':{if(st.screen!=='event'||st.event.done)return fail('不能選');const ev=D.events.find(e=>e.id===st.event.id);const opt=ev.opts[a.i];if(!opt)return fail('沒有這個選項');if(opt.need&&opt.need.gold&&st.gold<opt.need.gold)return fail('渡鴉幣不夠');
   const {out,pend}=applyEvent(D,st,opt,E);st.event.done={i:a.i,out};if(pend){if(pend.mode==='remove'&&!st.deck.length){}else st.pick=pend;}break;}
  default:return fail('不明的指令');}
 return {ok:true,state:st,events:E};}

// ── 永久進度（回憶、成就、圖鑑）
function newMeta(){return {v:1,memory:0,unlocked:[],ach:[],codex:{},runs:0,wins:{yy:0,cl:0},best:0,seen:[]};}
function metaApply(D,meta0,events){const meta=clone(meta0);const news={ach:[],codex:[],unlocks:[],memory:0};
 for(const e of events){
  if(e.t==='ach'&&e.id&&!meta.ach.includes(e.id)){meta.ach.push(e.id);news.ach.push(e.id);}
  if(e.t==='kill'){if(!meta.codex[e.id])news.codex.push(e.id);meta.codex[e.id]=(meta.codex[e.id]||0)+1;if(Object.keys(meta.codex).length>=20&&!meta.ach.includes('codex20')){meta.ach.push('codex20');news.ach.push('codex20');}}
  if(e.t==='runEnd'){meta.runs++;meta.memory+=e.memory;news.memory=e.memory;if(e.win)meta.wins[e.ch]=(meta.wins[e.ch]||0)+1;meta.best=Math.max(meta.best,e.floors||0);
   for(const u of D.unlocks)if(meta.memory>=u.at&&!meta.unlocked.includes(u.id)){meta.unlocked.push(u.id);news.unlocks.push(u.id);}}}
 return {meta,news};}

const API={newRun,apply,desc,cardDef,cost,needsTarget,canMove,alive,dmgCalc,newMeta,metaApply,memoryOf,pool};
if(typeof module!=='undefined')module.exports=API;else root.CARD=API;
})(this);

</script>
<script>
const D=window.CARD_DATA,C=window.CARD,I=D.img;
const RUNK='dive_run_v1',METAK='dive_meta_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st=null,meta=null,sel=null,busy=false;
function ls(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function save(){ls(RUNK,st&&st.screen!=='over'?st:null);ls(METAK,meta);}
function sceneOf(id){if(id==='title'||id==='pick'||id==='book')return 'title';if(id==='map')return 'map';if(id==='cb')return st&&st.combat?(st.combat.kind==='boss'?'boss':st.combat.kind==='elite'?'elite':(D.audio.bgm['bgm_battle_'+(st.layer+1)]?'bgm_battle_'+(st.layer+1):'battle')):'battle';if(id==='pg')return st&&['rest','shop','event','chest'].includes(st.screen)?'rest':null;return null;}
function show(id){const sc=sceneOf(id);if(sc&&typeof bgm==='function')bgm(sc);document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$('detail').classList.remove('on');$('hint').style.display='none';if(id==='title')drawTitle();if(id==='pick')drawPick();}
function toast(h){const e=document.createElement('div');e.className='toast';e.innerHTML=h;$('toasts').appendChild(e);setTimeout(()=>e.remove(),3100);}
function modal(h){$('mbox').innerHTML=h;$('modal').classList.add('on');}
function closeModal(){$('modal').classList.remove('on');}
const CH=()=>D.chars[st.ch];
function chImg(k){return k==='cl'?null:D.chars[k].img;}

// ── 動作與永久進度
function act(a){const r=C.apply(D,st,a);if(!r.ok){flash(r.error);return null;}st=r.state;const m=C.metaApply(D,meta,r.events);meta=m.meta;
 for(const id of m.news.ach){const A=D.achievements.find(x=>x.id===id);if(A)toast(`成就達成：<b>${esc(A.n)}</b>`);}
 for(const id of m.news.codex)toast(`圖鑑新增：<b>${esc(D.enemies[id].n)}</b>`);
 r.news=m.news;save();return r;}
function flash(t){const h=$('hint');h.textContent=t;h.style.display='block';clearTimeout(h._t);h._t=setTimeout(()=>h.style.display='none',1300);}

// ── 對話
let TQ=[],TCB=null;
function talk(lines,cb){TQ=lines.slice();TCB=cb||null;const L=st&&D.layers[Math.min(st.layer,D.layers.length-1)];$('talk').style.backgroundImage=`url(${L?L.bg:I+'bg_guild.webp'})`;$('talk').classList.add('on');talkNext();}
let TEX={yy:null,cl:null};
function talkNext(){if(!TQ.length){$('talk').classList.remove('on');const cb=TCB;TCB=null;TEX={yy:null,cl:null};cb&&cb();return;}
 const [who,ex,txt]=TQ.shift();if(ex)TEX[who]=ex;const yy=D.chars.yy,cl=D.chars.cl;
 const yimg=(TEX.yy&&yy.ex[TEX.yy])||yy.img,cimg=(TEX.cl&&cl.ex&&cl.ex[TEX.cl])||cl.img;
 const yOn=who==='yy';sfx('sfx_button');
 $('talk').innerHTML=`<img class="por l ${yOn?'':'dim'}" src="${yimg}" alt="">${cimg?`<img class="por r ${yOn?'dim':''}" src="${cimg}" alt="">`:`<div class="lampP" style="opacity:${yOn?.35:1}"></div>`}
 <div class="box"><div class="who">${who==='yy'?'語嫣':'克勞德'}</div><div class="say">${esc(txt)}</div><div class="tap">點一下繼續</div></div>`;}

// ── 標題、選角
function drawTitle(){$('tbg').style.backgroundImage=`url(${I}bg_guild.webp)`;const s=ls(RUNK);$('bCont').style.display=s&&s.screen!=='over'?'':'none';
 $('tver').textContent=D.version;
 $('tmem').textContent=meta.runs?`回憶 ${meta.memory}　·　下潛 ${meta.runs} 次　·　走完 ${(meta.wins.yy||0)+(meta.wins.cl||0)} 次`:'';}
function drawPick(){$('pbg').style.backgroundImage=`url(${I}bg_station.webp)`;
 $('chlist').innerHTML=Object.entries(D.chars).map(([k,c])=>`<div class="ch">${c.img?`<img src="${c.img}" alt="">`:`<div class="lamp"></div>`}<div><h3>${c.name}</h3><small>${c.title}・生命 ${c.hp}</small><p>${esc(c.desc)}</p><p style="color:var(--dim);font-size:13px">「${esc(c.line)}」</p><p class="relics"><img src="${D.relics[c.relic].ic}" alt=""> <small style="align-self:center">${D.relics[c.relic].n}：${D.relics[c.relic].d}</small></p><button class="main" onclick="startRun('${k}')">就是她</button></div></div>`).join('');}
function startRun(k){st=C.newRun(D,(Date.now()%2147483647)>>>0,k,meta);save();talk(D.talk.start[k],()=>{drawMap();show('map');});}
function contRun(){st=ls(RUNK);if(!st)return;route();}
function route(){const s=st.screen;if(s==='map'){drawMap();show('map');}else if(s==='combat'){drawCombat();show('cb');}else{drawPage();show('pg');}}

// ── 共用頂欄
function topBar(){return `<span class="pill">${CH().name}</span><span class="pill" style="min-width:110px"><span style="flex:1">生命 ${Math.max(0,st.hp)}／${st.maxHp}</span></span><span class="pill"><img src="${I}i_coin.webp" alt="">${st.gold}</span><span class="relics">${st.relics.map(r=>`<img src="${D.relics[r].ic}" onclick="relicInfo('${r}')" alt="">`).join('')}</span><span style="flex:1"></span><button onclick="soundMenu()" aria-label="聲音">♪</button><button onclick="showDeck()">牌組 ${st.deck.length}</button>`;}
function relicInfo(r){const R=D.relics[r];modal(`<div class="rel"><img src="${R.ic}" alt=""><div><b>${R.n}</b><small>${R.d}</small></div></div><p><button onclick="closeModal()">關閉</button></p>`);}

// ── 卡牌樣子
function cardHtml(c,extra,cls){const d=C.cardDef(D,c);const k=C.cost(D,c);return `<div class="card ${d.t} ch_${d.ch} r${d.r} ${c.tax?'taxed':''} ${cls||''}" ${extra||''}><div class="ci" style="background-image:url(${d.img})"></div>${d.t!=='x'?`<div class="cc">${k}</div>`:''}<div class="cn ${c.up?'up':''}">${esc(d.n)}</div><div class="cd">${esc(C.desc(D,c))}</div></div>`;}
const TYPE={a:'攻擊',s:'技能',p:'能力',x:'詛咒'};

// ── 地圖
const NODE={fight:{n:'戰鬥',ic:I+'sk_bash.webp'},elite:{n:'菁英',ic:I+'st_fury.webp'},event:{n:'事件',ic:I+'st_echo.webp'},shop:{n:'商店',ic:I+'i_coin.webp'},rest:{n:'營火',ic:I+'i_torch.webp'},chest:{n:'寶箱',ic:I+'i_seal.webp'}};
function drawMap(){const L=D.layers[st.layer];$('mbg').style.backgroundImage=`url(${L.bg})`;$('mbar').innerHTML=topBar();
 $('mlg').innerHTML=`<b style="color:var(--gold);width:100%;text-align:center;font-size:15px">${L.n}</b>`+Object.values(NODE).map(n=>`<span><img src="${n.ic}" alt="">${n.n}</span>`).join('');
 const map=st.maps[st.layer];const W=Math.min(innerWidth,420),cols=D.map.cols,rows=D.map.rows;const gx=W/(cols+1),gy=86,top=70;const H=top+gy*rows+40;
 const pos=(r,c)=>({x:gx*(c+1),y:top+gy*(rows-1-r)+gy});
 let lines='',nodes='';
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const n=map.rows[r][c];const p=pos(r,c);if(r<rows-1)for(const e of n.e){const q=pos(r+1,e);const walked=st.row>r&&r===(st.row-1)&&c===st.prevCol;lines+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#7a6446" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>`;}
  else lines+=`<line x1="${p.x}" y1="${p.y}" x2="${W/2}" y2="${top-10}" stroke="#7a6446" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>`;}
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const n=map.rows[r][c];const p=pos(r,c);const can=st.screen==='map'&&C.canMove(D,st,c)&&r===st.row+1;const here=st.row===r&&st.col===c;const done=r<st.row||(r===st.row&&!here);
  nodes+=`<g class="node${can?' can':''}${here?' here':''}${done?' done':''}" transform="translate(${p.x},${p.y})" ${can?`onclick="go(${c})"`:''}><circle class="bg2" r="24"/><clipPath id="nc${r}${c}"><circle r="20"/></clipPath><image href="${NODE[n.t].ic}" x="-20" y="-20" width="40" height="40" clip-path="url(#nc${r}${c})" preserveAspectRatio="xMidYMid slice"/></g>`;}
 const bcan=st.screen==='map'&&C.canMove(D,st,'boss');const B=D.enemies[L.boss];
 nodes+=`<g class="node${bcan?' can':''}" transform="translate(${W/2},${top-26})" ${bcan?`onclick="go('boss')"`:''}><circle class="bg2" r="36"/><clipPath id="ncb"><circle r="32"/></clipPath><image href="${B.img}" x="-32" y="-32" width="64" height="64" clip-path="url(#ncb)" preserveAspectRatio="xMidYMin slice"/><text y="52" text-anchor="middle" fill="#e9c98a" font-size="13">${B.n}</text></g>`;
 $('mwrap').innerHTML=`<svg width="${W}" height="${H+20}" viewBox="0 -20 ${W} ${H+20}">${lines}${nodes}</svg>`;
 requestAnimationFrame(()=>{const w=$('mwrap');w.scrollTop=w.scrollHeight;if(st.row>=2)w.scrollTop=Math.max(0,top+gy*(rows-1-st.row)-120);});}
function go(c){if(busy)return;const prev=st.col;const r=act({type:'MOVE',c});if(!r)return;st.prevCol=prev;
 if(c==='boss'){const b=D.layers[st.layer].boss;const B=D.enemies[b];window._bl=[...(D.talk.boss[b]&&D.talk.boss[b][st.ch]||[])];modal(`<div style="text-align:center"><img src="${B.img}" style="width:70%;border-radius:10px" alt=""><h2 style="color:var(--red)">${B.n}</h2><p class="big">${esc(B.line)}</p><button class="main" onclick="closeModal();talk(window._bl,()=>{drawCombat();show('cb');banner('第 1 回合')})">迎戰</button></div>`);return;}
 route();if(st.screen==='combat'){const lines=meetLines();if(lines.length)talk(lines,()=>banner('第 1 回合'));else banner('第 1 回合');}}
function meetLines(){const out=[];meta.met=meta.met||[];for(const e of st.combat.enemies){const m=D.talk.meet&&D.talk.meet[e.id];if(!meta.met.includes(e.id)){meta.met.push(e.id);if(m&&m[st.ch])out.push(m[st.ch]);}}save();return out;}

// ── 戰鬥畫面
function intentHtml(e){const m=e.intent;const c=st.combat;const parts=[];const am=(D.enemies[e.id].boss||D.enemies[e.id].elite)?1:(D.layers[st.layer].atkMul||1);
 if(m.a){const d=C.dmgCalc(Math.round(m.a*am),e,c);parts.push(`<img src="${I}st_fury.webp" alt="">${d}${m.h>1?'×'+m.h:''}`);}
 if(m.b)parts.push(`<img src="${I}st_wall.webp" alt="">${m.b}`);
 if(m.s)parts.push(`<img src="${D.status[m.s[0]]?D.status[m.s[0]].ic:I+'st_might.webp'}" alt="">強化`);
 if(m.st)parts.push(`<img src="${D.status[m.st[0]].ic}" alt="">${D.status[m.st[0]].name}`);
 if(m.heal)parts.push(`<img src="${I}st_regen.webp" alt="">回復`);
 if(m.tax)parts.push(`<img src="${I}i_coin.webp" alt="">加價`);
 if(m.steal)parts.push(`<img src="${I}st_hide.webp" alt="">偷牌`);
 if(m.clr)parts.push(`<img src="${I}st_pure.webp" alt="">解約`);
 if(m.drainInk)parts.push(`<img src="${I}st_erase.webp" alt="">吸墨`);
 if(m.addCard)parts.push(`<img src="${I}${D.cards[m.addCard[0]].t==='x'?'st_curse':'st_slow'}.webp" alt="">${D.cards[m.addCard[0]].t==='x'?'詛咒':'疲勞'}`);
 return `<div class="intent ${m.a?'atk':''}" onclick="event.stopPropagation();intentInfo('${e.uid}')">${parts.join(' ')}</div>`;}
function intentInfo(uid){const e=st.combat.enemies.find(x=>x.uid===uid);const m=e.intent;flash(`${e.n}：${m.n}`);}
function stsHtml(sts,ink){const out=Object.entries(sts).filter(([k,v])=>v&&D.status[k]).map(([k,v])=>`<span onclick="event.stopPropagation();stInfo('${k}')"><img src="${D.status[k].ic}" alt="">${v}</span>`);if(ink)out.push(`<span onclick="event.stopPropagation();stInfo('ink')"><img src="${D.status.ink.ic}" alt="">${ink}</span>`);return out.join('');}
function stInfo(k){flash(D.status[k].name+'：'+D.status[k].desc);}
function drawCombat(){const c=st.combat;if(!c)return;$('cbg').style.backgroundImage=`url(${D.layers[st.layer].bg})`;$('cbar').innerHTML=topBar();
 const tgtMode=sel!=null&&C.needsTarget(D,c.hand[sel]);
 $('foes').innerHTML=c.enemies.map(e=>`<div class="foe${e.hp<=0?' dead':''}${tgtMode&&e.hp>0?' tgt':''}" id="f_${e.uid}" onclick="tapFoe('${e.uid}')">${e.hp>0?intentHtml(e):''}<img class="art" src="${D.enemies[e.id].img}" alt=""><div class="nm">${esc(e.n)} ${e.block?`<span class="blk"><img src="${I}st_wall.webp" style="width:14px;height:14px;border-radius:50%" alt="">${e.block}</span>`:''}</div><div class="hpbar"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div><div class="hpt">${Math.max(0,e.hp)}／${e.max}</div><div class="sts">${stsHtml(e.st)}</div></div>`).join('');
 $('me').innerHTML=`<div class="orb">${c.energy}</div><div class="info"><div class="row"><b>${CH().name}</b><span>生命 ${Math.max(0,st.hp)}／${st.maxHp}</span>${c.block?`<span class="blk"><img src="${I}st_wall.webp" style="width:16px;height:16px;border-radius:50%" alt="">格擋 ${c.block}</span>`:''}${st.ch==='cl'||c.ink?`<span class="inkb">墨 ${c.ink}</span>`:''}</div><div class="hpbar" style="margin:4px 0"><i style="width:${Math.max(0,st.hp/st.maxHp*100)}%"></i></div><div class="sts" style="justify-content:flex-start">${stsHtml(c.st)}${Object.entries(c.pw).map(([k,v])=>`<span onclick="flash('${esc(D.powers[k].replace('{n}',v))}')"><img src="${I}st_vow.webp" alt="">${v}</span>`).join('')}</div></div>`;
 $('hand').innerHTML=c.hand.map((x,i)=>cardHtml(x,`onclick="tapCard(${i})"`,(i===sel?'sel ':'')+((C.cost(D,x)>c.energy||C.cost(D,x)<0)?'no':''))).join('');
 $('pDraw').textContent=`抽牌堆 ${c.draw.length}`;$('pDisc').textContent=`棄牌堆 ${c.disc.length}`;
 drawDetail();}
function drawDetail(){const c=st.combat;const el=$('detail');if(sel==null||!c||!c.hand[sel]){el.classList.remove('on');$('hint').style.display='none';return;}
 const x=c.hand[sel];const d=C.cardDef(D,x);const need=C.needsTarget(D,x);const k=C.cost(D,x);
 el.innerHTML=`<h4>${esc(d.n)}　<small style="color:var(--dim)">${TYPE[d.t]}・${k<0?'不能打出':k+' 能量'}</small></h4><p>${esc(C.desc(D,x))}</p>${d.t==='x'?'':need&&C.alive(c).length>1?'<p style="color:#ffcdbf">點一個敵人打出</p>':`<button class="main" onclick="playSel()">打出</button>`} <button onclick="sel=null;drawCombat()">取消</button>`;el.classList.add('on');}
function tapCard(i){if(busy)return;sel=sel===i?null:i;drawCombat();}
function tapFoe(uid){if(busy||sel==null)return;const c=st.combat;if(!C.needsTarget(D,c.hand[sel]))return;doPlay(sel,uid);}
function playSel(){if(sel==null)return;const c=st.combat;const a=C.alive(c);doPlay(sel,a.length===1?a[0].uid:null);}
async function doPlay(i,uid){busy=true;const card=st.combat.hand[i];const before=snapshot();sel=null;const r=act({type:'PLAY',i,target:uid});if(!r){busy=false;drawCombat();return;}
 await animate(r.events,before,card);busy=false;after(r);}
function snapshot(){return st.combat?{en:st.combat.enemies.map(e=>({uid:e.uid,hp:e.hp})),hp:st.hp}:null;}
const FX={a:I+'fx_slash.webp',pact:I+'fx_threads.webp',ink:I+'fx_erase.webp',judge:I+'fx_doom.webp',block:I+'fx_shieldglow.webp',heal:I+'fx_heal.webp',link:I+'fx_web.webp'};
function pop(el,txt,cls){if(!el)return;const n=document.createElement('div');n.className='num '+(cls||'');n.textContent=txt;el.appendChild(n);setTimeout(()=>n.remove(),950);}
function fxOn(el,img){if(!el||!img)return;const f=document.createElement('img');f.className='fxi';f.src=img;el.appendChild(f);setTimeout(()=>f.remove(),600);}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function animate(evs,before,card){
 for(const e of evs){
  if(e.t==='play'){const d=D.cards[e.id];sfx('sfx_card_play');if(d.fx.some(f=>f[0]==='pa'||f[0]==='lk'))sfx('sfx_pact');if(d.fx.some(f=>f[0]==='ink'))sfx('sfx_ink');if(d.t==='a'&&e.tg)fxOn($('f_'+e.tg),FX.a);if(d.fx.some(f=>f[0]==='pa'))(e.tg?[$('f_'+e.tg)]:document.querySelectorAll('.foe')).forEach(x=>fxOn(x,FX.pact));if(d.fx.some(f=>f[0]==='lk'))document.querySelectorAll('.foe').forEach(x=>fxOn(x,FX.link));if(d.fx.some(f=>f[0]==='da'))document.querySelectorAll('.foe').forEach(x=>fxOn(x,FX.a));}
  else if(e.t==='hit'){sfx('sfx_hit');const el=$('f_'+e.to);if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');pop(el,e.blocked?(e.n-e.blocked||'擋'):e.n);}await wait(110);}
  else if(e.t==='judge'){sfx('sfx_judge');document.querySelectorAll('.foe').forEach(x=>fxOn(x,FX.judge));await wait(250);}
  else if(e.t==='inkUse'){sfx('sfx_stroke');fxOn($('me'),FX.ink);pop($('me'),'墨 -'+e.n,'p');}
  else if(e.t==='block'){sfx('sfx_block');fxOn($('me'),FX.block);pop($('me'),'+'+e.n,'b');}
  else if(e.t==='heal'){fxOn($('me'),FX.heal);pop($('me'),'+'+e.n,'h');}
  else if(e.t==='kill'){const el=$('f_'+e.uid);if(el)el.classList.add('dead');await wait(250);}
  else if(e.t==='relic'){toast(`<b>${D.relics[e.id].n}</b> 發動了`);}
  else if(e.t==='selfHurt'){const m=$('me');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');pop(m,'-'+e.n,'p');await wait(150);}
  else if(e.t==='mhp')toast(`最大生命 <b>${e.n}</b>`);
  else if(e.t==='gold'){sfx('sfx_coin');toast(`多得 <b>${e.n}</b> 渡鴉幣`);}
  else if(e.t==='shuffle')sfx('sfx_shuffle');
  else if(e.t==='spawn'||e.t==='split'){flash(e.t==='spawn'?'拆出了新的敵人':'牠分裂了');await wait(200);}
  else if(e.t==='return')toast('被叼走的牌回來了');
 }
 drawCombatIf();await wait(160);}
function drawCombatIf(){if(st.screen==='combat')drawCombat();}
async function endTurn(){if(busy||st.screen!=='combat')return;busy=true;sel=null;$('detail').classList.remove('on');const r=act({type:'END_TURN'});if(!r){busy=false;return;}
 banner('敵人回合');await wait(500);
 for(const e of r.events){
  if(e.t==='enemyAct'){const el=$('f_'+e.uid);if(el){el.style.transform='translateY(14px) scale(1.04)';setTimeout(()=>el.style.transform='',180);}{const en=(st.combat?st.combat.enemies:[]).find(x=>x.uid===e.uid);flash((en?en.n+'：':'')+e.n);}await wait(260);}
  else if(e.t==='selfHurt'){const m=$('me');pop(m,'-'+e.n,'p');await wait(150);}
  else if(e.t==='steal'){toast(`<b>${esc(D.cards[e.id].n)}</b> 被叼走了`);await wait(200);}
  else if(e.t==='drain'){flash('墨被吸走了 '+e.n);await wait(200);}
  else if(e.t==='tax'){toast(`手上 ${e.n} 張牌這回合 <b>費用 +1</b>`);}
  else if(e.t==='clr'){flash('厄契被解除了');await wait(200);}
  else if(e.t==='turn'){sfx('sfx_draw');}
  else if(e.t==='shuffle')sfx('sfx_shuffle');
  else if(e.t==='hurt'){sfx('sfx_hit');const m=$('me');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');pop(m,e.blocked&&e.n===e.blocked?'擋':'-'+(e.n-e.blocked));await wait(200);}
  else if(e.t==='recoil'){const el=$('f_'+e.to);fxOn(el,FX.pact);pop(el,e.n,'p');await wait(200);}
  else if(e.t==='relic')toast(`<b>${D.relics[e.id].n}</b> 發動了`);
  else if(e.t==='kill'){const el=$('f_'+e.uid);if(el)el.classList.add('dead');}
 }
 busy=false;
 if(st.screen==='combat'){drawCombat();banner('第 '+st.combat.turn+' 回合');}
 after(r);}
function banner(t){const b=$('turnBan');b.textContent=t;b.classList.remove('go');void b.offsetWidth;b.classList.add('go');}
function after(r){if(!r)return;
 if(st.screen==='combat'){drawCombat();return;}
 if(st.screen==='over'){runEnd(r);return;}
 if(r.events.some(e=>e.t==='win')){const w=r.events.find(e=>e.t==='win');playJingle('jingle_win');setTimeout(()=>{drawPage();show('pg');},500);return;}
 route();}

// ── 各種頁面
function drawPage(){const s=st.screen;const L=D.layers[st.layer]||D.layers[D.layers.length-1];$('gbg').style.backgroundImage=`url(${L.bg})`;$('gbar').innerHTML=topBar();let h='';
 if(s==='reward'){const rw=st.reward;if(!rw._coin){rw._coin=1;sfx('sfx_coin');}h=`<h2>勝利</h2><p class="big"><img src="${I}i_coin.webp" style="width:20px;vertical-align:middle;border-radius:50%" alt=""> 得到 ${rw.gold} 渡鴉幣</p>`;
  if(rw.relic){const R=D.relics[rw.relic];h+=`<div class="rel"><img src="${R.ic}" alt=""><div><b>得到遺物：${R.n}</b><small>${R.d}</small></div></div>`;}
  if(rw.relicChoice){h+=`<h3 style="color:var(--gold)">選一件遺物帶走</h3>`+rw.relicChoice.map((id,i)=>{const R=D.relics[id];return `<div class="rel" onclick="pickRelic(${i})"><img src="${R.ic}" alt=""><div><b>${R.n}</b><small>${R.d}</small></div></div>`;}).join('');}
  if(rw.relicTaken){const R=D.relics[rw.relicTaken];h+=`<div class="rel"><img src="${R.ic}" alt=""><div><b>帶走了：${R.n}</b><small>${R.d}</small></div></div>`;}
  if(!rw.cardTaken&&rw.cards.length){h+=`<h3 style="color:var(--gold)">選一張牌加入牌組</h3><div class="cards">${rw.cards.map((id,i)=>cardHtml({id,up:0},`onclick="pickCard(${i})"`)).join('')}</div><p style="text-align:center"><button onclick="skipCard()">不拿</button></p>`;}
  else h+=`<p style="text-align:center;margin-top:18px"><button class="main" onclick="leave()" ${rw.relicChoice?'disabled':''}>繼續往下</button></p>`;}
 else if(s==='rest'){h=`<h2>營火</h2><p class="big">火光很暖。可以在這裡歇一下。</p><button class="opt" onclick="rest()">休息<small>回復 ${Math.floor(st.maxHp*.3)+(st.relics.includes('teapot')?15:0)} 點生命</small></button><button class="opt" onclick="smith()">磨亮一張牌<small>選一張牌強化</small></button>`;}
 else if(s==='chest'){const id=st.reward.chest;h=`<h2>寶箱</h2>`+(id?`<div class="rel"><img src="${D.relics[id].ic}" alt=""><div><b>${D.relics[id].n}</b><small>${D.relics[id].d}</small></div></div>`:`<p class="big">箱子裡只有 ${st.reward.gold} 枚渡鴉幣。</p>`)+`<p><button class="main" onclick="leave()">繼續往下</button></p>`;}
 else if(s==='shop'){const sh=st.shop;h=`<h2>沒有臉的攤主</h2><p style="color:var(--dim)">「看看吧。用渡鴉幣就好。」</p><div class="cards">${sh.cards.map((it,i)=>`<div>${cardHtml({id:it.id,up:0},it.sold?'':`onclick="buyCard(${i})"`,it.sold?'no':'')}<span class="price">${it.sold?'已售出':it.price+' 幣'}</span></div>`).join('')}</div>
  ${sh.relics.map((it,i)=>{const R=D.relics[it.id];return `<div class="rel" ${it.sold?'style="opacity:.4"':`onclick="buyRelic(${i})"`}><img src="${R.ic}" alt=""><div><b>${R.n}　${it.sold?'已售出':it.price+' 幣'}</b><small>${R.d}</small></div></div>`;}).join('')}
  <button class="opt" onclick="pickDeck('remove')" ${sh.removed?'disabled':''}>請攤主收走一張牌<small>${sh.removed?'已經用過了':sh.removeCost+' 渡鴉幣'}</small></button><p><button class="main" onclick="leave()">離開</button></p>`;}
 else if(s==='event'){const ev=D.events.find(e=>e.id===st.event.id);$('gbg').style.backgroundImage=`url(${ev.img})`;h=`<h2>${esc(ev.n)}</h2><p class="big">${esc(ev.txt)}</p>`;
  if(st.pick){h+=pickHtml();}
  else if(!st.event.done)h+=ev.opts.map((o,i)=>`<button class="opt" onclick="evPick(${i})" ${o.need&&o.need.gold&&st.gold<o.need.gold?'disabled':''}>${esc(o.t)}<small>${esc(o.d)}</small></button>`).join('');
  else{const out=st.event.done.out||[];h+=`<p class="big">${esc(ev.opts[st.event.done.i].d)}。</p>`+out.map(o=>o.relic?`<div class="rel"><img src="${D.relics[o.relic].ic}" alt=""><div><b>${D.relics[o.relic].n}</b><small>${D.relics[o.relic].d}</small></div></div>`:o.card?`<p>得到：${D.cards[o.card].n}</p>`:o.upgraded?`<p>升級了：${D.cards[o.upgraded].n}</p>`:'').join('')+`<p><button class="main" onclick="leave()">繼續往下</button></p>`;}}
 if(st.pick&&s!=='event')h+=pickHtml();
 $('gpage').innerHTML=h;}
function pickHtml(){const p=st.pick;if(p.mode==='choose')return `<h3 style="color:var(--gold)">選一張</h3><div class="cards">${p.cards.map((id,i)=>cardHtml({id,up:0},`onclick="chooseC(${i})"`)).join('')}</div><p style="text-align:center"><button onclick="chooseC(null)">都不要</button></p>`;
 const t={remove:'選一張牌移除',transform:'選一張牌交換',upgrade:'選一張牌強化'}[p.mode];
 return `<h3 style="color:var(--gold)">${t}</h3><div class="cards">${st.deck.filter(c=>p.mode==='upgrade'?(!c.up&&D.cards[c.id].u):!D.cards[c.id].noRemove).map(c=>cardHtml(c,`onclick="deckPick(${c.uid})"`)).join('')}</div>`;}
function pickCard(i){const r=act({type:'PICK_CARD',i});if(r){toast(`<b>${D.cards[r.events.find(e=>e.t==='gotCard').id].n}</b> 加入牌組`);drawPage();}}
function skipCard(){if(act({type:'SKIP_CARD'}))drawPage();}
function pickRelic(i){if(act({type:'PICK_RELIC',i}))drawPage();}
function leave(){const lay=st.layer;const r=act({type:'LEAVE'});if(!r)return;if(st.screen==='over'){runEnd(r);return;}if(st.layer!==lay){toast(`進入 <b>${D.layers[st.layer].n}</b>`);}route();}
function campTalk(cb){const L=D.talk.rest;if(!L||!L.length){cb();return;}const W=D.talk.restW||L.map(()=>1);let v=Math.random()*W.reduce((a,b)=>a+b,0),i=0;for(;i<L.length-1;i++){v-=W[i]||1;if(v<0)break;}talk(L[i],cb);}

function buyCard(i){const r=act({type:'BUY_CARD',i});if(r){sfx('sfx_coin');toast('買下了');drawPage();}}
function buyRelic(i){const r=act({type:'BUY_RELIC',i});if(r){sfx('sfx_coin');toast('買下了');drawPage();}}

 if(p.mode==='upgrade'){st.pick=null;r=act({type:'SMITH',uid});if(r){toast('牌被磨亮了');campTalk(route);}return;}

function runEnd(r){const ev=r.events.find(e=>e.t==='runEnd');const win=st.result&&st.result.win;const news=r.news||{unlocks:[]};
 const pool=[win?D.talk.win[st.ch]:D.talk.lose[st.ch],...((win?D.talk.winMore:D.talk.loseMore)||{})[st.ch]||[]];const lines=pool[Math.floor(Math.random()*pool.length)];playJingle(win?'jingle_clear':'jingle_lose');
 talk(lines,()=>{const s=st.stats;let h=`<h2>${win?'回到地面了':'燈，暫時熄了'}</h2><p class="big">${win?'三層都走完了。':'走到了'+D.layers[st.layer].n+'。'}</p>
  <div class="rel"><div><b>這一局</b><small>走了 ${s.floors} 步 · 打倒 ${s.kills} 隻 · 菁英 ${s.elites} · 首領 ${s.bosses}<br>一張牌最多打出 ${s.dmgMax} 點傷害 · 打出 ${s.cards} 張牌</small></div></div>
  <div class="rel"><img src="${I}st_echo.webp" alt=""><div><b>得到回憶 ${ev?ev.memory:0}</b><small>累積 ${meta.memory}</small></div></div>`;
  for(const id of news.unlocks){const u=D.unlocks.find(x=>x.id===id);h+=`<div class="rel" style="border-color:var(--gold)"><img src="${I}st_vow.webp" alt=""><div><b>解鎖！</b><small>${esc(u.t)}</small></div></div>`;}
  const nx=D.unlocks.filter(u=>!meta.unlocked.includes(u.id)).sort((a,b)=>a.at-b.at)[0];if(nx)h+=`<p style="color:var(--dim)">再累積 ${nx.at-meta.memory} 回憶：${esc(nx.t)}</p>`;
  h+=`<p><button class="main" onclick="ls(RUNK,null);st=null;show('title')">回到地面</button></p>`;
  $('gbar').innerHTML='';$('gpage').innerHTML=h;show('pg');});}

// ── 回憶之書、圖鑑、成就
function showNotes(){modal(`<h2 style="color:var(--gold);margin-top:0">公告</h2>`+(D.notes||[]).map(n=>`<h3 style="margin:12px 0 4px;color:${n.ver===D.version?'var(--gold)':'var(--dim)'}">${n.ver}${n.ver===D.version?'（目前版本）':''}</h3><ul style="margin:0;padding-left:20px;line-height:1.7">${n.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`).join('')+`<p><button class="main" onclick="closeModal()">知道了</button></p>`);meta.seenVer=D.version;ls(METAK,meta);}
function openBook(){$('btitle').textContent='回憶之書';$('bbg').style.backgroundImage=`url(${I}bg_library.webp)`;
 let h=`<p style="color:var(--dim)">回憶 ${meta.memory}。每一次下潛，不管走到哪裡，都會留下回憶。</p>`;
 h+=D.unlocks.map(u=>{const got=meta.unlocked.includes(u.id);const st2=D.stories[u.id];return `<div class="rel" style="${got?'':'opacity:.5'}" ${got&&st2?`onclick="readStory('${u.id}')"`:''}><img src="${I}${got?'st_vow':'st_seal'}.webp" alt=""><div><b>${got?esc(u.t):'？？？'}</b><small>${got?(st2?'點一下閱讀':'已解鎖'):'累積 '+u.at+' 回憶'}</small></div></div>`;}).join('');
 $('bpage').innerHTML=h;show('book');}
function readStory(id){talk(D.stories[id].lines,()=>{});}
function openCodex(){$('btitle').textContent='圖鑑';$('bbg').style.backgroundImage=`url(${I}bg_codex.webp)`;const ks=Object.keys(D.enemies);const n=ks.filter(k=>meta.codex[k]).length;
 $('bpage').innerHTML=`<p style="color:var(--dim)">記錄了 ${n}／${ks.length} 種</p><div class="codex">${ks.map(k=>{const e=D.enemies[k];const got=meta.codex[k];return `<div class="${got?'':'no'}" ${got?`onclick="codexInfo('${k}')"`:''}><img src="${e.img}" alt="">${got?esc(e.n)+'<br>打倒 '+got:'？？？'}</div>`;}).join('')}</div>`;show('book');}
function codexInfo(k){const e=D.enemies[k];modal(`<div style="text-align:center"><img src="${e.img}" style="width:70%;border-radius:10px" alt=""><h2 style="color:var(--gold)">${esc(e.n)}</h2><p class="big">${esc(((D.codex||{})[k]||'').replace(/^[^：]*：/,''))}</p><p style="color:var(--dim)">打倒 ${meta.codex[k]} 次</p><button onclick="closeModal()">關閉</button></div>`);}
function openAch(){$('btitle').textContent='成就';$('bbg').style.backgroundImage=`url(${I}bg_hall.webp)`;const n=meta.ach.length;
 $('bpage').innerHTML=`<p style="color:var(--dim)">${n}／${D.achievements.length}</p>`+D.achievements.map(a=>{const g=meta.ach.includes(a.id);return `<div class="ach ${g?'got':''}"><i>${g?'✓':''}</i><div>${esc(a.n)}<small>${esc(a.d)}</small></div></div>`;}).join('');show('book');}


// ── 聲音：Web Audio（第一次點擊後才會出聲）
const AU={ctx:null,buf:{},cur:null,curName:null,want:null,opt:{music:true,sfx:true}};
try{const o=JSON.parse(localStorage.getItem('dive_audio')||'null');if(o)AU.opt=o;}catch(e){}
function auSave(){try{localStorage.setItem('dive_audio',JSON.stringify(AU.opt));}catch(e){}}
const AD=D.audio||{dir:'',bgm:{},jingle:[],sfx:[],scene:{}};
const haveBgm=n=>!!(AD.bgm&&AD.bgm[n]);
function auInit(){if(AU.ctx)return;try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);
 AD.sfx.forEach(n=>load(n));if(AU.want)bgm(AU.want,true);}catch(e){AU.ctx=null;}}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>{auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();},{passive:true}));
function load(n){if(AU.buf[n])return AU.buf[n];AU.buf[n]=fetch(AD.dir+n+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(b=>new Promise((ok,no)=>AU.ctx.decodeAudioData(b,ok,no))).catch(()=>null);return AU.buf[n];}
function sfx(n){if(!AU.ctx||!AU.opt.sfx||!AD.sfx.includes(n))return;load(n).then(b=>{if(!b)return;const s=AU.ctx.createBufferSource();s.buffer=b;const g=AU.ctx.createGain();g.gain.value=.7;s.connect(g);g.connect(AU.master);s.start();});}
function bgm(scene,force){let n=AD.scene[scene]||scene;if(!haveBgm(n))n=AD.fallback;AU.want=scene;if(!AU.ctx||!n)return;if(!force&&AU.curName===n&&AU.cur)return;
 const old=AU.cur;AU.cur=null;AU.curName=n;if(old){const t=AU.ctx.currentTime;old.g.gain.cancelScheduledValues(t);old.g.gain.setValueAtTime(old.g.gain.value,t);old.g.gain.linearRampToValueAtTime(0,t+.8);setTimeout(()=>{try{old.s.stop();}catch(e){}},900);}
 if(!AU.opt.music)return;load(n).then(b=>{if(!b||AU.curName!==n||AU.cur)return;const s=AU.ctx.createBufferSource();s.buffer=b;s.loop=true;const cfg=AD.bgm[n]||{};s.loopStart=cfg.loopStart||0;s.loopEnd=Math.min(cfg.loopEnd||b.duration,b.duration);
  const g=AU.ctx.createGain();g.gain.value=0;s.connect(g);g.connect(AU.master);s.start();g.gain.linearRampToValueAtTime(.55,AU.ctx.currentTime+.8);AU.cur={s,g};});}
function playJingle(n){if(!AU.ctx||!AD.jingle.includes(n))return;if(AU.cur){const t=AU.ctx.currentTime;AU.cur.g.gain.linearRampToValueAtTime(0,t+.4);const o=AU.cur;setTimeout(()=>{try{o.s.stop();}catch(e){}},500);AU.cur=null;AU.curName=null;}
 if(!AU.opt.music)return;load(n).then(b=>{if(!b)return;const s=AU.ctx.createBufferSource();s.buffer=b;const g=AU.ctx.createGain();g.gain.value=.7;s.connect(g);g.connect(AU.master);s.start();});}
function soundMenu(){modal(`<h2 style="color:var(--gold);margin-top:0">聲音</h2><button class="opt" onclick="AU.opt.music=!AU.opt.music;auSave();if(!AU.opt.music&&AU.cur){try{AU.cur.s.stop();}catch(e){}AU.cur=null;AU.curName=null;}else bgm(AU.want||'title',true);soundMenu()">音樂：${AU.opt.music?'開':'關'}</button><button class="opt" onclick="AU.opt.sfx=!AU.opt.sfx;auSave();soundMenu()">音效：${AU.opt.sfx?'開':'關'}</button><p><button onclick="closeModal()">關閉</button></p>`);}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx('sfx_button');},true);

// ── 開始
meta=ls(METAK)||C.newMeta();
function ageGate(next){if(ls('dive_age')===20){next();return;}const g=$('gate');g.innerHTML=`<div class="box"><h2 style="color:var(--red);margin-top:0">進入之前</h2><p class="big">《渡鴉下潛》含有心理恐怖、黑暗與令人不安的內容，也會出現血跡與死亡的描寫。</p><p class="big">本作僅適合 <b>20 歲以上</b>、能接受這類題材的玩家。</p><p><button class="main" id="ageYes">我已滿 20 歲，進入</button></p><p><button id="ageNoBtn">離開</button></p></div>`;g.classList.add('on');
 $('ageYes').onclick=()=>{ls('dive_age',20);g.classList.remove('on');next();};$('ageNoBtn').onclick=()=>{g.querySelector('.box').innerHTML='<h2 style="margin-top:0">門沒有打開</h2><p class="big">這條往下的路，等妳準備好了再來。</p>';};}
function boot(){if(meta.seenVer!==D.version)showNotes();}
(function(){const s=ls(RUNK);if(s&&s.v===1&&s.screen!=='over')st=s;drawTitle();ageGate(boot);})();
</script>
