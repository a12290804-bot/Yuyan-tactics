<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="永生戰棋">
<title>永生戰棋</title>
<style>
:root{--bg:#120e0b;--panel:#1d1712;--line:#3a2e24;--ink:#e9dcc4;--dim:#a8977c;--gold:#d8b56a;--blue:#6f9fd8;--red:#d86a5f;--warn:#b48cff;--ok:#8fc77a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
body{padding:calc(8px + env(safe-area-inset-top)) 8px calc(150px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
h1{font-size:16px;line-height:1.3;margin:0;color:var(--gold);letter-spacing:1px;flex:1 1 100%}
.chip{font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.gatebar{flex:1;min-width:110px;height:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#2a1d17}
.gatebar i{display:block;height:100%;background:linear-gradient(90deg,#a2543e,#d8b56a)}
#board{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:#0a0807;border:1px solid var(--line);border-radius:6px;padding:1px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;overflow:hidden}
.c .tg{position:absolute;left:2px;top:1px;font-size:9px;color:#0008;font-weight:700;pointer-events:none}
.PLAIN{background:#5b5140}.FOREST{background:#34452e}.HILL{background:#7a6748}.SWAMP{background:#3d4636}.WALL{background:#2b2a2a}.SHALLOW_WATER{background:#33505a}.DEEP_WATER{background:#1b2d38}.FLESH{background:#6b2f2f}.GATE{background:#4a3221}
.FOREST{background-image:radial-gradient(circle at 30% 40%,#2a3a25 18%,transparent 19%),radial-gradient(circle at 70% 65%,#2a3a25 18%,transparent 19%)}
.HILL{background-image:linear-gradient(135deg,transparent 45%,#8a7655 46%,#8a7655 54%,transparent 55%)}
.WALL{background-image:repeating-linear-gradient(0deg,#3a3837 0 3px,#2b2a2a 3px 8px)}
.FLESH{background-image:radial-gradient(circle at 40% 50%,#8a3c38 20%,transparent 22%)}
.SHALLOW_WATER,.DEEP_WATER{background-image:repeating-linear-gradient(160deg,transparent 0 6px,#ffffff10 6px 8px)}
.c{background-size:cover;background-position:center}
.ico{object-fit:cover}
.c.FLESH{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{filter:brightness(1.25) saturate(1.2)}}
.c.zone{box-shadow:inset 0 0 0 100px #e8c56a26,inset 0 0 0 1px #e8c56a88}
.c.reach::after{content:"";position:absolute;inset:0;background:#6f9fd855;border:1px solid #6f9fd8aa}
.c.dash::after{background:#9f7fd855;border-color:#b48cff}
.c.threat::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#d86a5f40 0 3px,transparent 3px 7px);pointer-events:none}
.c.tgt{outline:2px solid var(--red);outline-offset:-2px}
.c.ally{outline:2px solid var(--ok);outline-offset:-2px}
.c.zsel{outline:2px dashed var(--gold);outline-offset:-2px}
.c.zprev{box-shadow:inset 0 0 0 100px #e8c56a55}
.c.tgtsel{outline:3px solid #fff;outline-offset:-3px}
.c.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.c.warn .wv{position:absolute;right:1px;bottom:0;font-size:10px;color:var(--warn)}
.c.dest{box-shadow:inset 0 0 0 2px #fff}
.u{position:relative;z-index:2;width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.4vw,17px);font-weight:700;border:2px solid #0008;box-shadow:0 1px 3px #000a}
.u.P{background:radial-gradient(circle at 35% 30%,#a9c6ea,#3e6aa0);color:#0d1a2b}
.u.E{background:radial-gradient(circle at 35% 30%,#efa49a,#93372e);color:#2a0b07}
.u.cmd{border-color:var(--gold);box-shadow:0 0 0 2px #d8b56a88}
.u.acted{filter:grayscale(.75) brightness(.7)}
.u.ghost{opacity:.4}
.u.img{background-size:cover;background-position:center;color:transparent;text-shadow:none}
.u.img.raw{background-size:175%;background-position:50% 10%}.u.E.img.raw{background-size:cover;background-position:50% 28%}
.u.P.img{border-color:#6f9fd8}.u.E.img{border-color:#d86a5f}.u.cmd.img{border-color:var(--gold)}
.u .hp{position:absolute;left:8%;right:8%;bottom:-3px;height:4px;background:#000a;border-radius:2px;overflow:hidden}
.u .hp i{display:block;height:100%;background:var(--ok)}
.u.E .hp i{background:#f0c070}
.u .sn{position:absolute;left:-5px;bottom:-5px;font-size:9px;line-height:1;background:#111c;color:#fff;border-radius:6px;padding:1px 3px;font-weight:400}
.u .ic{position:absolute;right:-5px;top:-5px;display:flex;gap:1px}
.u .ic b{font-size:8.5px;line-height:1;background:var(--gold);color:#000;border-radius:5px;padding:1px 2px;font-weight:700}
.u .ic b.r{background:#b48cff}.u .ic b.m{background:#ff8a6a}.u .ic b.f{background:#9fd1ff}
.gatec{z-index:2;font-size:clamp(11px,3.4vw,16px);color:var(--gold);font-weight:700}
.c.flash{animation:fl .35s}
@keyframes fl{0%{filter:brightness(2.2)}100%{filter:none}}
#info .por{float:left;width:64px;height:85px;object-fit:cover;border-radius:6px;margin:0 8px 4px 0;border:1px solid var(--line)}
.ico{width:18px;height:18px;vertical-align:-4px;border-radius:3px;margin-right:2px}
button .ico{width:20px;height:20px}
#title{position:fixed;inset:0;z-index:60;background:#000 center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:24px 20px calc(40px + env(safe-area-inset-bottom));text-align:center}
#title h2{font-size:34px;letter-spacing:8px;color:#e9dcc4;margin:0 0 6px;text-shadow:0 2px 12px #000}
#title p{color:#cbbfa6;margin:0 0 18px;max-width:420px;line-height:1.6;text-shadow:0 1px 6px #000}
#title.hide{display:none}
#hub.hide,.inhub #board,.inhub #info,.inhub #log{display:none}
#hub{min-height:60vh;border-radius:10px;background:#000 center/cover;padding:12px;position:relative}
#hub .res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.facs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fac{position:relative;border:1px solid #5a4632;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#000 center/cover;cursor:pointer;display:flex;align-items:flex-end}
.fac b{display:block;width:100%;padding:8px;background:linear-gradient(transparent,#000e);color:var(--gold);font-size:15px}
.fac small{color:var(--dim);font-weight:400;display:block;font-size:12px}
.fac.lock{filter:grayscale(.8) brightness(.55);cursor:default}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{position:relative;aspect-ratio:2/3;background:#000 center/100% 100% no-repeat;border-radius:6px;overflow:hidden}
.card .ph{position:absolute;left:12%;right:12%;top:9%;bottom:20%;background:#000 center 15%/cover;border-radius:4px}
.card .nm{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
.card .nw{position:absolute;top:3%;right:6%;font-size:9px;background:var(--gold);color:#000;border-radius:4px;padding:0 3px}
.card.r2{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 14px #ffcc66}}
.ros{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;margin:5px 0;background:#16110d}
.ros img{width:44px;height:58px;object-fit:cover;object-position:50% 12%;border-radius:5px}
.ros img.ico{width:18px;height:18px;border-radius:3px;object-position:center}
.ros.on{border-color:var(--gold);background:#2a2015}
.rar0{color:#c9b89a}.rar1{color:#9fc4ff}.rar2{color:#ffcc66}
.eqi{width:46px;height:46px;object-fit:cover;border-radius:7px;border:2px solid #5a4632;background:#000;flex:none}
.eqi.r1{border-color:#5f8fd0}.eqi.r2{border-color:#e0b050;box-shadow:0 0 8px #e0b05077}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.eqs .sl{border:1px dashed var(--line);border-radius:8px;padding:6px;text-align:center;cursor:pointer;background:#16110d;font-size:12px;min-height:92px}
.eqs .sl .eqi{width:54px;height:54px;margin:0 auto 3px;display:block}
.eqs .sl.on{border-style:solid}
.hp2{display:flex;gap:10px;align-items:flex-start}
.hp2 .por{width:120px;aspect-ratio:3/4;object-fit:cover;object-position:50% 10%;border-radius:8px;border:1px solid var(--line);flex:none}
.stt{display:grid;grid-template-columns:auto auto;gap:1px 10px;font-size:13px}
.stt .p{color:#8fd28f;font-size:12px}
.tabs{display:flex;gap:4px;margin:6px 0}
.tabs button.on{background:var(--gold);color:#000}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mats div{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:#16110d;font-size:13px}
.scene{width:100%;aspect-ratio:16/7;background:center/cover;border-radius:8px 8px 0 0;margin:-8px -8px 6px;width:calc(100% + 16px)}
.tal3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tal3 .col{border:1px solid var(--line);border-radius:8px;padding:5px;background:#16110d}
.tal3 .col>b{display:block;text-align:center;color:var(--gold)}
.tn{display:flex;gap:5px;align-items:center;padding:3px;border-radius:6px;margin-top:4px;border:1px solid transparent;font-size:11px;line-height:1.3;cursor:pointer;opacity:.45}
.tn .ti{width:34px;height:34px;flex:none;border-radius:6px;background-size:300% 300%;border:1px solid #3a2e22}
.tn.has{opacity:1;border-color:var(--gold);background:#2a2015}.tn.can{opacity:1;border-color:#6f9fd8;animation:tglow 1.6s infinite}
@keyframes tglow{50%{box-shadow:0 0 8px #6f9fd8}}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.cos div{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;cursor:pointer;font-size:11px;text-align:center;position:relative}
.cos img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 10%;display:block}
.cos div.on{border-color:var(--gold);box-shadow:0 0 8px #e0b05088}.cos div.lk img{filter:grayscale(1) brightness(.45)}
.cos span{display:block;padding:2px}
#bwrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:6px}
body.z1 #bwrap,body.z2 #bwrap{max-height:64vh}
body.z1 #board{width:calc(12 * 44px)}body.z2 #board{width:calc(12 * 56px)}
body.z1 .u{font-size:16px}body.z2 .u{font-size:19px}body.z1 .c .tg,body.z2 .c .tg{font-size:11px}
.inhub #bwrap{display:none}
body.pix #board .c,body.pix #board .u,body.pix #cut .por2,body.pix #cut .sd{image-rendering:pixelated}
#cut.sk{background:#000 center 30%/cover}
#cut .skn{position:absolute;right:4%;bottom:12%;text-align:right;color:#fff;text-shadow:0 2px 8px #000,0 0 18px #e0b050;animation:skn .9s ease-out}
#cut .skn b{display:block;font-size:clamp(26px,8vw,42px);letter-spacing:.12em;color:#ffe6a8}
#cut .skn small{font-size:13px;color:#d8c8a8}
#cut .skp{position:absolute;left:0;bottom:0;width:46%;height:100%;background:center top/cover no-repeat;-webkit-mask-image:linear-gradient(to right,#000 60%,transparent);mask-image:linear-gradient(to right,#000 60%,transparent);animation:skp .5s ease-out}
#cut .skf{position:absolute;inset:0;background:radial-gradient(circle at 70% 50%,#fff8 0,transparent 40%);mix-blend-mode:screen;animation:skf .9s ease-out forwards}
@keyframes skn{0%{transform:translateX(40px);opacity:0}30%{opacity:1}100%{transform:none}}
@keyframes skp{0%{transform:translateX(-30px);opacity:0}100%{transform:none;opacity:1}}
@keyframes skf{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#ftoast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);max-width:min(92vw,460px);background:#1d1610f2;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#ftoast.on{opacity:1;pointer-events:auto}
#tut{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 74px);max-width:520px;margin:0 auto;background:#123a5ef0;border:1px solid #6f9fd8;border-radius:10px;padding:8px 10px;font-size:14px;z-index:35;display:flex;gap:8px;align-items:center;justify-content:space-between;box-shadow:0 4px 14px #000a}
#tut.hide{display:none}
#talk{position:fixed;inset:0;z-index:80;background:#000;overflow:hidden;cursor:pointer}#talk.hide{display:none}
#talk .tbg{position:absolute;inset:0;background:#000 center/cover;filter:brightness(.55)}
#talk .tl,#talk .tr{position:absolute;bottom:17vh;width:min(56vw,440px);height:auto;max-height:66vh;object-fit:contain;object-position:50% 100%;transition:filter .25s,transform .25s;-webkit-mask-image:linear-gradient(to top,transparent,#000 24%,#000 88%,transparent),linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to top,transparent,#000 24%,#000 88%,transparent),linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);mask-composite:intersect}
#talk .tl{left:-4vw;z-index:1}#talk .tr{right:-4vw;z-index:1}
#talk .dim{filter:brightness(.45) grayscale(.3);transform:scale(.94);z-index:0}
#talk .tbox{position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;min-height:118px;background:#120d0aee;border:1px solid var(--gold);border-radius:12px;padding:12px 14px 34px;font-size:16px;line-height:1.75;color:#efe3c8}
#talk.nar .ttx{color:#cbbfa6;font-style:italic}
#talk .tnm{position:absolute;top:-14px;left:14px;background:#2a2015;border:1px solid var(--gold);border-radius:8px;padding:1px 12px;color:var(--gold);font-size:14px}
#talk .tbt{position:absolute;right:8px;bottom:6px}
.u.spr{background:none!important;border-color:transparent!important;box-shadow:none!important;border-radius:0;overflow:visible}
.u.spr .spi{position:absolute;left:-28%;right:-28%;bottom:-6%;height:156%;background-repeat:no-repeat;image-rendering:pixelated;animation:sprIdle .9s steps(4) infinite;pointer-events:none;z-index:1}
.u.spr::before{content:'';position:absolute;bottom:-2%;left:8%;right:8%;height:24%;border-radius:50%;background:#3e6aa099}.u.spr.E::before{background:#a8403599}
.u.spr.acted .spi{animation:none;filter:grayscale(.7) brightness(.65)}
.u.spr .hp{z-index:2}
@keyframes sprIdle{from{background-position:0% 0%}to{background-position:80% 0%}}
@keyframes sprIdle4{from{background-position:0% 0%}to{background-position:133.333% 0%}}
.g6r4{background-size:600% 400%!important}.g6r3{background-size:600% 300%!important}.g4r3{background-size:400% 300%!important}
.spi.g4r3,.spr2.g4r3{animation-name:sprIdle4!important}
.u.spr.E .spi{transform:scaleX(-1)}
.u.spr.cmd .spi{height:180%;left:-40%;right:-40%}
#cut .side.lunge .por2.spr2.g6r3{animation:sprAtk3 .55s steps(6) 1 forwards!important}
#cut .side.lunge .por2.spr2.g4r3{animation:sprAtk43 .5s steps(4) 1 forwards!important}
@keyframes sprAtk3{from{background-position:0% 50%}to{background-position:120% 50%}}
@keyframes sprAtk43{from{background-position:0% 50%}to{background-position:133.333% 50%}}
#cut .por2.spr2{width:52%;background-position:0% 0%;image-rendering:pixelated;-webkit-mask-image:none;mask-image:none;animation:sprIdle .9s steps(4) infinite}
#cut .side.lunge .por2.spr2{animation:sprAtk .55s steps(6) 1 forwards}
@keyframes sprAtk{from{background-position:0% 33.333%}to{background-position:120% 33.333%}}
#cut .skp.spr3{width:58%;background-size:600% 400%!important;background-position:0% 66.667%;image-rendering:pixelated;-webkit-mask-image:none;mask-image:none;animation:sprSk .9s steps(6) 1 forwards}
@keyframes sprSk{from{background-position:0% 66.667%}to{background-position:120% 66.667%}}
.pxprev{width:96px;height:96px;background-size:600% 400%!important;image-rendering:pixelated;animation:sprIdle .9s steps(4) infinite;margin:4px auto 0}
.sico{display:inline-block;width:18px;height:18px;border-radius:3px;background-size:300% 300%;vertical-align:middle;margin-right:3px}
button .sico{width:20px;height:20px}
.u .sb{position:absolute;left:-3px;top:-3px;display:flex;gap:1px;z-index:3}.u .sb b{font-size:8px;line-height:1;padding:1px 2px;border-radius:3px;background:#000c;color:#ffd27a}.u .sb b.bad{color:#ff8f7a}
.tal3.t4{grid-template-columns:repeat(2,1fr)}
.xpb{height:5px;background:#000;border-radius:3px;overflow:hidden;margin:3px 0}.xpb i{display:block;height:100%;background:var(--gold)}
.pick img{width:52px;height:69px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pick img.ico,#info img.ico{width:18px;height:18px;border:0;border-radius:3px;object-fit:cover}
#info{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:76px;font-size:14px;line-height:1.55}
#info b{color:var(--gold)}
.say{color:#e8c9a0}.note{color:var(--dim);font-size:12px}.bad{color:var(--red)}.good{color:var(--ok)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#120e0bf2;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:20}
button{font:inherit;font-size:14px;color:var(--ink);background:#2a2119;border:1px solid #5a4632;border-radius:8px;padding:8px 11px;min-height:42px;cursor:pointer}
#bar button{font-size:13.5px}
@media (max-width:440px){#bar{gap:4px;padding-left:6px;padding-right:6px}#bar button{font-size:13px;padding:8px 9px;white-space:nowrap}}
#info{overflow:auto;-webkit-overflow-scrolling:touch}
.prw{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));background:#000}
.prw img{width:100%;max-width:640px;max-height:58vh;object-fit:contain;border-radius:8px;box-shadow:0 0 30px #000;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent);animation:prf .8s ease-out}
@keyframes prf{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
button.pri{background:#5a3f22;border-color:var(--gold);color:#fff3da}
button.sk{background:#3a2a4a;border-color:#b48cff}
button.dng{background:#4a1f1b;border-color:#a2543e}
button:disabled{opacity:.4}
#log{margin-top:8px;background:#0e0b09;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.5;max-height:180px;overflow:auto;color:var(--dim)}
#log div.s{color:#e8c9a0}#log div.e{color:var(--gold)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:65;padding:16px}
.modal.hide{display:none}
.box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;max-width:500px;width:100%;max-height:86vh;overflow:auto;padding:14px 16px;font-size:14px;line-height:1.6}
.box h2{margin:0 0 6px;color:var(--gold);font-size:18px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
.pick{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;cursor:pointer;background:#16110d}
.pick.on{border-color:var(--gold);background:#2a2015}
.pick .no{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3e6aa0;color:#fff;font-weight:700}
.pick.on .no{background:var(--gold);color:#000}

#board{position:relative}
.c.fog::after{content:'';position:absolute;inset:0;background:#0b0a09d9;z-index:3;pointer-events:none}
.c.pt{box-shadow:inset 0 0 0 2px var(--gold)}.c.ln{box-shadow:inset 0 0 0 1px #c0504080;background-blend-mode:multiply;background-color:#4a1a14}
.fxl{position:absolute;pointer-events:none;z-index:5;mix-blend-mode:screen;background:center/contain no-repeat;animation:fxa .7s ease-out forwards}
@keyframes fxa{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.35)}}
.dmgn{position:absolute;z-index:6;pointer-events:none;font-weight:700;color:#ffe2b0;text-shadow:0 0 4px #000,0 0 2px #000;font-size:14px;animation:dmga .9s ease-out forwards}
.dmgn.crit{color:#ff9a6a;font-size:18px}.dmgn.st{color:#ff9f8a;font-size:11px;top:-6px}.dmgn.stg{color:#9fd3ff;font-size:11px}
#board.shake{animation:bshake .45s}@keyframes bshake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
.rar3{color:#d9b8ff;text-shadow:0 0 6px #9b6bff88}.dmgn.heal{color:#9fe39b}.dmgn.miss{color:#ccc;font-size:12px}
@keyframes dmga{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
#cut{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);height:min(62vw,330px);max-width:540px;margin:0 auto;z-index:40;background:#000 center/cover;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);overflow:hidden;display:none}
#cut.on{display:block;animation:cutin .18s ease-out}
@keyframes cutin{0%{clip-path:inset(50% 0 50% 0)}100%{clip-path:inset(0 0 0 0)}}
#cut .side{position:absolute;bottom:6%;width:48%;height:80%}
#cut .L{left:1%}#cut .R{right:1%}
#cut .por2{position:absolute;bottom:0;width:42%;height:100%;background:center top/cover no-repeat;-webkit-mask-image:linear-gradient(to top,transparent,#000 25%);mask-image:linear-gradient(to top,transparent,#000 25%)}
#cut .L .por2{left:0}#cut .R .por2{right:0;transform:scaleX(-1)}
#cut .sq{position:absolute;bottom:0;display:flex;gap:0;align-items:flex-end}
#cut .L .sq{left:36%}#cut .R .sq{right:36%;flex-direction:row-reverse}
#cut .sd{width:clamp(28px,8vw,46px);height:clamp(48px,13vw,74px);margin-right:-8px;background:center/cover no-repeat;-webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 50%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 55%,#000 50%,transparent 72%);transition:opacity .4s,transform .4s}
#cut .R .sd{transform:scaleX(-1)}
#cut .sd.gone{opacity:0;transform:translateY(10px) scale(.9)}#cut .R .sd.gone{transform:scaleX(-1) translateY(10px) scale(.9)}
#cut .L.lunge{animation:lungeL .35s ease-in-out}#cut .R.lunge{animation:lungeR .35s ease-in-out}
@keyframes lungeL{50%{transform:translateX(14%)}}@keyframes lungeR{50%{transform:translateX(-14%)}}
#cut .nm{position:absolute;top:6px;font-size:13px;color:#fff;text-shadow:0 1px 3px #000;background:#0008;padding:2px 8px;border-radius:6px}
#cut .L .nm{left:6px}#cut .R .nm{right:6px}
#cut .fxc{position:absolute;width:44%;height:90%;top:5%;mix-blend-mode:screen;background:center/contain no-repeat;opacity:0}
#cut .fxc.go{animation:fxa .6s ease-out forwards}
#cut .num{position:absolute;top:30%;font-size:26px;font-weight:700;color:#ffe2b0;text-shadow:0 0 6px #000;opacity:0}
#cut .num.go{animation:dmga 1s ease-out forwards}
#cut .skip{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;color:#cbbfa6;background:#0008;padding:1px 8px;border-radius:6px}
.mapw{position:relative;width:100%;aspect-ratio:2/3;background:center/cover;border-radius:8px;border:1px solid var(--line);margin:6px 0}
.pin{position:absolute;transform:translate(-50%,-50%);font-size:11px;padding:2px 6px;border-radius:8px;background:#000b;border:1px solid #5a4632;color:var(--dim);white-space:nowrap;cursor:pointer}
.pin.open{border-color:var(--gold);color:#fff3da;background:#5a3f22e0;font-size:12px;animation:glow 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.c.flash{animation:none}}

.city-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.city-person{min-height:100px;text-align:left;padding:14px;background:linear-gradient(135deg,#30291f,#151310);border:1px solid #726048;white-space:normal}.city-person span{display:block;font-size:18px;color:#ead5b1}.city-person small{display:block;color:#b9aa91;margin-top:8px}.trait,.match-panel{border-left:3px solid #aa8d53;padding:6px 9px;background:#a3894b12}.combat-preview{padding:10px;border:1px solid #aa8d53;border-radius:7px;background:#24201b}.combat-preview strong{font-size:24px;color:#f0d591}.rescue-mark,.escort-mark,.match{position:absolute;z-index:5;pointer-events:none;font-size:10px;font-weight:700;padding:1px 3px;background:#111d;border-radius:3px}.rescue-mark{inset:8% 20%;display:grid;place-items:center;color:#f6dc85;border:2px solid #d2b46b;font-size:16px}.escort-mark{bottom:0;left:0;color:#f6dc85}.match{right:0;top:0;color:#ddd}.match.good{color:#abebbd}.match.bad{color:#ff9b91}.card.r3{border:2px solid #d3a5ee;box-shadow:0 0 12px #9f60cd88}.rar3{color:#d8b6f0}
@media(prefers-reduced-motion:reduce){.shake,.flash{animation:none!important}}


.skill-select-label{display:flex;align-items:center;gap:6px;flex:1 1 100%;font-size:13px;color:#cabb9e}.skill-select-label select{flex:1;min-width:0;max-width:100%;padding:9px;color:#f0dfbc;background:#241e17;border:1px solid #b69b61;border-radius:7px;font-size:15px}.practice{color:#a8cab2;font-size:12px}.book-card{padding:10px;border:1px solid #66563d;border-radius:8px;margin:9px 0}.book-card button{margin:3px 0}

<body>
<header>
 <h1>永生戰棋　<span class="note" id="sub">黑鐘城・第一次圍攻</span></h1>
 <span class="chip" id="rd">第 1／8 回合</span>
 <span class="chip" id="ph">我方回合</span>
 <span class="chip" id="cr" title="濁度：污染地越多越高">濁度 0</span>
 <span class="note"><span id="gl">城門</span> <b id="gh">300</b></span><div class="gatebar"><i id="gb" style="width:100%"></i></div>
</header>
<div id="hub" class="hide"></div>
<div id="bwrap"><div id="board" aria-label="棋盤"></div></div>
<div id="info"></div>
<div id="ftoast"></div><div id="tut" class="hide"></div><div id="talk" class="hide"></div>
<div id="log"></div>
<div id="bar"></div>
<div class="modal hide" id="modal"><div class="box" id="box"></div></div>
<div id="title" class="hide"></div>
<div id="cut" aria-hidden="true"></div>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="camp.js"></script>
<script src="sfx.js"></script>
<script src="talk.js"></script>
<script>
'use strict';
const D=window.TACTICS_DATA,C=window.TACTICS,SAVE_KEY='yyt_save_v3';
// 網頁和資料版本不一致（網站還在換新檔）→ 自動重新抓一次
const PAGE_VER='v1.5.0';(function(){try{if(D.version!==PAGE_VER){const k='yyt_vfix_'+D.version+'_'+PAGE_VER;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.href);}}}catch(e){}})();let mid='MISSION_BC_001';const MM=()=>D.missions[(st&&st.missionId)||mid];
const ART=p=>{if(!p)return '';if(D.artMap&&D.artMap[p])return D.artMap[p];const q=p;return /^(?:https?:|data:|blob:|\.\.?\/|\/|inbox\/|assets\/)/.test(q)?q:D.artRoot+q;};const SICO=S=>S&&S.ic?`<i class="sico" style="background-image:url(${S.ic[0]});background-position:${(S.ic[1]%3)*50}% ${Math.floor(S.ic[1]/3)*50}%"></i>`:ICO(S&&S.icon);
const ICO=n=>n?`<img class="ico" src="${ART((n.startsWith('st_')?'status/':'icons/')+n+'.webp')}" alt="">`:'';
(function(){let css='';for(const [k,t] of Object.entries(D.terrain))if(t.art)css+=`.c.${k}{background-image:url(${ART(t.art)})}`;const e=document.createElement('style');e.id='tcss';e.textContent=css;document.head.appendChild(e);})();
const SLOT_NAMES=['城門前（最前線）','右前方','左側高地','門前左後','門前右後','右側高地'];const TS=D.teamSize||4;
let seed,acts,team,level=0,st,sel=null,showThreat=false,busy=false,inspect=null,camp;
const CAMP_KEY='yyt_camp_v1';function saveCamp(){LS.set(CAMP_KEY,camp);}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function startBattle(s,tm,lv){seed=(s==null?(Date.now()%2147483647):s)>>>0;team=JSON.parse(JSON.stringify(tm||team));level=lv==null?level:lv;acts=[];st=C.createBattle(D,mid,seed,{team,level});BGM.play(st.units.some(u=>u.commander)?'boss':'battle');sel=null;inspect=null;persist();closeModal();hideHub();render();logAll(true);intro();SFX.play('turn');{const p=C.alive(st,'P')[0];if(p)setTimeout(()=>focusOn(p.x,p.y,true),50);}}
function persist(){LS.set(SAVE_KEY,{v:4,mission:mid,ruleset:D.rulesetVersion,seed,acts,team,level});}
function clearBattle(){LS.set(SAVE_KEY,null);acts=[];}
let titleHasSave=false;
function enterCity(){showHub();const tip=()=>{if(!camp.flags.hubTip){camp.flags.hubTip=true;saveCamp();toastInfo('先去<b>議事桌</b>選隊伍出戰。');}};if(!camp.pcName)askName(()=>{drawHub();mythPick(tip);});else if(!camp.mythic)mythPick(()=>drawHub());}
function mythPick(after){const L=D.heroes.filter(h=>h.myth);if(!L.length||camp.mythic){after&&after();return;}mythPick.after=after;
 modal(`<h2>南門的燈下</h2><p class="say">登記完名字，守衛壓低聲音：「有兩位在等你。她們說，今晚先由其中一位陪你出城；另一位仍會回應招集。」</p><p class="note">開場選一位神秘成員免費加入。兩位之後都能從招集取得。</p>`+L.map(h=>{const sk=(D.personal[h.id]||[]).map(k=>D.skills[k].name).join('、');const inn=(D.innateTxt||{})[h.id];return `<div class="ros" style="align-items:flex-start;flex-wrap:wrap"><img src="${CAMP.art(h)}" alt="" style="width:110px;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:8px"><div style="flex:1;min-width:150px"><b class="rar3">${esc(h.name)}</b> <span class="note">${esc(h.title)}・神秘</span><br><span class="note">${esc(h.bio||'')}</span><br><span class="say">招式：${esc(sk)}</span>${inn?`<br><span class="note">天生：${esc(inn[0])}——${esc(inn[1])}</span>`:''}<br><button class="pri" style="margin-top:6px" onclick="doMyth('${h.id}')">選 ${esc(h.name)}</button></div></div>`;}).join(''));}
function doMyth(id){if(!confirm('確定選 '+CAMP.heroOf(D,id).name+'？之後不能換。'))return;const r=CAMP.chooseMythic(D,camp,id);if(!r.ok){toastInfo(r.error);return;}saveCamp();SFX.play('r2');closeModal();const h=CAMP.heroOf(D,id);const L=(TALK.chat[id]||[]).filter(x=>x[0]===0).map(x=>x[1]);talk([{who:id,t:L[0]||'……'}],{bg:'bg_talk_gate',hero:id},()=>{drawHub();toastInfo(esc(h.name)+' 加入了，也放進出戰隊伍。');const a=mythPick.after;a&&a();});}
function titleScreen(hasSave){const t=$('title');t.style.backgroundImage=`linear-gradient(to bottom,#0000 40%,#000d 85%),url(${ART('backgrounds/cover.webp')})`;
 titleHasSave=hasSave;t.innerHTML=`<h2>永生戰棋</h2><p>渡鴉公會的外圍成員，來到天闕大陸北邊的白鐵礦城。</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${hasSave?'<button class="pri" onclick="SFX.unlock();$(\'title\').classList.add(\'hide\')">繼續戰鬥</button>':''}<button class="${hasSave?'':'pri'}" onclick="SFX.unlock();SFX.play('click');if(!camp.seenPrologue){prologue(enterCity);}else{$('title').classList.add('hide');enterCity();}">${hasSave?'回到據點':'開始'}</button><button onclick="SFX.unlock();prologue(()=>titleScreen(${hasSave}))">序章</button><button onclick="noticeShow()">公告${noticeSeen()?'':' ●'}</button></div><p class="note" style="margin-top:10px">${esc(D.version)}・紀錄只存在這台裝置</p>`;t.classList.remove('hide');}
function boot(){applyView();loadCostumes();setTimeout(sprPreload,400);try{const lv=localStorage.getItem('yyt_lastver');if(lv&&lv!==D.version)setTimeout(()=>toastInfo('已更新到 '+D.version+'，更新內容可以看公告。'),1800);localStorage.setItem('yyt_lastver',D.version);}catch(e){}camp=CAMP.fix(D,LS.get(CAMP_KEY));saveCamp();const sv=LS.get(SAVE_KEY);
 if(sv&&sv.ruleset!==D.rulesetVersion){LS.set(SAVE_KEY,null);setTimeout(()=>toastInfo('戰場規則已更新，上一場未結算戰鬥已返回整備。成員、裝備與補給均保留。'),2200);}
 if(sv&&sv.v===4&&D.missions[sv.mission]&&sv.ruleset===D.rulesetVersion&&Array.isArray(sv.acts)){try{mid=sv.mission;const s2=C.replay(D,mid,sv.seed,sv.acts,{team:sv.team,level:sv.level});seed=sv.seed;acts=sv.acts;team=sv.team;level=sv.level|0;st=s2;render();logAll(true);
  if(!st.result){toastInfo('<b>已接續上一場</b>（第 '+st.round+' 回合）。');titleScreen(true);return;}if(camp.lastBattle!==st.battleInstanceId){titleScreen(false);showResult();return;}}catch(e){console.warn(e);}}
 team=CAMP.teamFor(D,camp);seed=1;acts=[];st=C.createBattle(D,mid,1,{team});render();titleScreen(false);}


// ---------- 序章 ----------
function prologue(after){let i=0;const P=D.prologue;const t=$('title');t.classList.remove('hide');const show=()=>{if(i>=P.length){camp.seenPrologue=true;saveCamp();t.classList.add('hide');after&&after();return;}const p=P[i];const img=(D.artMap&&D.artMap['prologue/'+p.future+'.webp'])?'prologue/'+p.future+'.webp':p.img;
  t.style.backgroundImage=`linear-gradient(#000c,#000c),url(${ART(img)})`;t.innerHTML=`<div class="prw"><img src="${ART(img)}" alt=""><p style="font-size:16px;color:#efe3c8;max-width:440px;line-height:1.9;min-height:5em;margin-top:14px">${esc(p.txt)}</p><div style="display:flex;gap:8px"><button class="pri" onclick="event.stopPropagation();prologue.next()">${i<P.length-1?'繼續':'進入白鐵礦城'}</button><button onclick="event.stopPropagation();prologue.skip()">跳過</button></div><p class="note" style="margin-top:10px">${i+1}／${P.length}</p></div>`;};
 prologue.next=()=>{i++;SFX.play('click');show();};prologue.skip=()=>{i=P.length;show();};BGM.play('title');show();}
// ---------- 背景音樂（沿用渡鴉公會網站上的曲子） ----------
const BGM=(()=>{let el=null,cur=null,on=true;try{on=localStorage.getItem('yyt_bgm')!=='0';}catch(e){}
 function play(k){const name=D.bgm[k]||k;if(!on){cur=name;return;}if(cur===name&&el&&!el.paused)return;cur=name;const src=D.bgmRoot+name+'.mp3';const old=el;el=new Audio(src);el.loop=true;el.volume=0;el.play().then(()=>{let v=0;const iv=setInterval(()=>{v=Math.min(.45,v+.05);el&&(el.volume=v);if(v>=.45)clearInterval(iv);},80);}).catch(()=>{});
  if(old){let v=old.volume;const iv=setInterval(()=>{v=Math.max(0,v-.06);old.volume=v;if(v<=0){old.pause();clearInterval(iv);}},80);}}
 function set(v){on=!!v;try{localStorage.setItem('yyt_bgm',on?'1':'0')}catch(e){}if(!on&&el){el.pause();}else if(on&&cur){const c=cur;cur=null;play(c);}}
 return {play,set,isOn:()=>on};})();
function toggleBgm(){BGM.set(!BGM.isOn());if($('hub').classList.contains('hide'))menu();else drawHub();}
// ---------- 據點：白鐵礦城・南門 ----------
function showHub(){$('tut').classList.add('hide');BGM.play('base');document.body.classList.add('inhub');$('hub').classList.remove('hide');sel=null;drawHub();}
function hideHub(){document.body.classList.remove('inhub');$('hub').classList.add('hide');}
function resBar(){return `<div class="res"><span class="chip">招集券 <b>${camp.tickets}</b></span><span class="chip">補給 <b>${camp.supply}</b></span><span class="chip">白鐵 <b>${camp.mats.ore}</b></span><span class="chip">渡鴉幣 <b>${camp.coins}</b></span><span class="chip">成員 <b>${Object.keys(camp.roster).length}</b>／${D.heroes.length}</span><span class="chip">戰績 ${camp.wins} 勝／${camp.battles} 戰</span></div>`;}
function drawHub(){const H=$('hub');H.style.backgroundImage=`linear-gradient(#000a,#000c),url(${ART('backgrounds/base_bg.webp')})`;$('sub').textContent='白鐵礦城・南門據點';$('rd').textContent='據點';$('ph').textContent='整備中';$('cr').textContent='—';$('gl').textContent='';$('gh').textContent='';$('gb').parentElement.style.display='none';$('bar').innerHTML=`<button onclick="titleScreen(${acts&&acts.length&&!st.result?'true':'false'})">標題</button><button onclick="noticeShow()">公告${noticeSeen()?'':' ●'}</button><button onclick="saveMenu()">存檔</button><button onclick="hubMore()">設定</button>`;
 const F=[['fac_council','議事桌','選隊伍、出戰',"council()"],['fac_recruit','招集所','用招集券招人',"recruit()"],['fac_barracks','兵營','用補給補士兵',"barracks()"],['fac_roster','名冊','成員、聊天、裝備',"rosterList()"],['fac_storage','倉庫','裝備、素材、強化',"storage()"],['fac_wardrobe','衣櫃','時裝',"wardrobe()"],['fac_quest','委託板','城裡人的委託',"questBoard(true)"],['fac_workshop','南門街巷','居民、傳聞與救援',"citySquare()"],['fac_lighthouse','燈塔','即將開放','']];
 const live=acts&&acts.length&&!st.result;
 H.innerHTML=resBar()+(live?`<p><button class="pri" onclick="hideHub();render()">回到進行中的戰鬥（第 ${st.round} 回合）</button></p>`:'')+`<div class="facs">${F.map(([img,n,d,fn])=>`<div class="fac ${fn?'':'lock'}" style="background-image:url(${ART('backgrounds/'+img+'.webp')})" ${fn?`onclick="SFX.play('click');${fn}"`:''}><b>${n}<small>${d}</small></b></div>`).join('')}</div>`;}
function toggleSfx(){SFX.setOn(!SFX.isOn());if($('hub').classList.contains('hide'))menu();else drawHub();}
function heroCardImg(h){const r=camp&&camp.roster[h.id];if(r&&r.cos){const c=COS.find(x=>x.id===r.cos);if(c)return cosImg(c);}return CAMP.art(h);}
// ---------- 時裝（讀渡鴉公會的時裝目錄與存檔，只讀不改） ----------
let COS=(D.costumeExtra||[]).slice();
function cosImg(c){const n=(c.images&&c.images.normal)||'';const b=n.split('/').pop().replace(/\.(gif|jpg|png|webp)$/i,'');return D.costumeRoot+'art/opt/'+b+'.webp';}
function cosOrig(c){return D.costumeRoot+c.images.normal;}
function loadCostumes(){try{fetch(D.costumeCatalog,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!Array.isArray(j.costumes))return;for(const x of j.costumes){if(!x||x.published!==true||!x.images||!x.images.normal||!/^[a-z0-9_-]{1,80}$/.test(x.id))continue;if(!CAMP.heroOf(D,x.hero))continue;if(!COS.some(y=>y.id===x.id))COS.push({id:x.id,hero:x.hero,name:String(x.name||'時裝').slice(0,40),theme:String(x.theme||'').slice(0,30),line:String(x.line||'').slice(0,160),images:{normal:x.images.normal}});}}).catch(()=>{});}catch(e){}}
function rgOwned(){return new Set(camp.cosOwned||[]);}
function rgOwnedOld(){const out=new Set();for(const k of ['RAVEN_GUILD_V4','RAVEN_GUILD_V3','RAVEN_GUILD_V2']){let raw=null;try{raw=localStorage.getItem(k);}catch(e){}if(!raw)continue;try{let o=JSON.parse(raw);if(o&&typeof o.save==='string')o=JSON.parse(o.save);const arr=(o&&(o.costumeOwned240||(o.S&&o.S.costumeOwned240)))||[];for(const id of arr)if(typeof id==='string')out.add(id);}catch(e){}}return out;}
function cosArtFor(cid){const c=COS.find(x=>x.id===cid);return c?cosImg(c):null;}
// 議事桌：選 4 人出戰
let pickT=[];
function council(){if(acts&&acts.length&&!st.result&&!confirm('還有一場戰鬥沒打完，要放棄它重新出戰嗎？（放棄不會有獎勵）'))return;pickT=camp.team.slice();drawCouncil();}
function drawCouncil(){BGM.play('map');const ids=Object.keys(camp.roster).sort((a,b)=>CAMP.heroOf(D,b).r-CAMP.heroOf(D,a).r||a.localeCompare(b));

const selU=()=>sel&&st.units.find(v=>v.id===sel.id);
function reachOf(u){return C.reachable(D,st,u,sel&&sel.dash?{extra:D.skills.shadowStep.extraMove,ignoreZoc:true}:{});}
function normalTargets(u,to){return C.withPos(u,to,()=>C.targetsFrom(D,st,u,to));}
function cellsHi(){const H={reach:new Set(),dash:false,tgt:new Set(),ally:new Set(),zsel:new Set(),zprev:new Set(),threat:new Set(),dest:null,tsel:null};
 const u=selU();if(u){for(const k of reachOf(u).keys())H.reach.add(k);H.dash=!!sel.dash;if(sel.to){H.dest=C.key(sel.to.x,sel.to.y);
  if(sel.mode==='skill'){const S=C.skillOf(D,u,sel.sk);const ts=C.skillTargets(D,st,u,sel.to,sel.sk);const G=S.kind==='gen';
   if(S.kind==='around'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)H.zprev.add(C.key(sel.to.x+dx,sel.to.y+dy));ts.forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});}
   else if(sel.sk==='massMend'){for(let y=0;y<st.h;y++)for(let x=0;x<st.w;x++)if(Math.abs(x-sel.to.x)+Math.abs(y-sel.to.y)<=S.radius)H.zprev.add(C.key(x,y));}
   else if(G&&S.tg==='self'){if(S.shape==='around'||S.shape==='allyAround'||S.shape==='rand'){const r=S.shape==='rand'?S.range[1]:S.r||1;for(let y=0;y<st.h;y++)for(let x=0;x<st.w;x++){const d=Math.abs(x-sel.to.x)+Math.abs(y-sel.to.y);if(d<=r&&(S.shape!=='rand'||d>=S.range[0]))H.zprev.add(C.key(x,y));}}}
   else if(S.kind==='zone'||(G&&S.tg==='tile')){ts.forEach(k=>H.zsel.add(k));if(sel.at)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)H.zprev.add(C.key(sel.at.x+dx,sel.at.y+dy));}
   else if(S.kind==='ally'||(G&&S.tg==='ally'))ts.forEach(id=>{const v=st.units.find(x=>x.id===id);H.ally.add(id===u.id?C.key(sel.to.x,sel.to.y):C.key(v.x,v.y));});else ts.forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});}
  else if(sel.dash){C.skillTargets(D,st,u,sel.to,'shadowStep').forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});}
  else normalTargets(u,sel.to).forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});
  if(sel.target){const v=st.units.find(x=>x.id===sel.target);if(v)H.tsel=C.key(v.x,v.y);}}}
 if(inspect){const v=st.units.find(x=>x.id===inspect);if(v&&v.hp>0)for(const k of threatOf(v))H.threat.add(k);}
 if(showThreat){const VIS=visSet(st);for(const v of C.alive(st,'E'))if(!VIS||VIS.has(C.key(v.x,v.y)))for(const k of threatOf(v))H.threat.add(k);}
 return H;}
function threatOf(u){const out=new Set();const R=C.reachable(D,st,u);for(const k of R.keys()){const [x,y]=k.split(',').map(Number);const [a,b]=C.rangeOf(D,st,u,{x,y});for(let dy=-b;dy<=b;dy++)for(let dx=-b;dx<=b;dx++){const d=Math.abs(dx)+Math.abs(dy);if(d<a||d>b)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=st.w||ny>=st.h)continue;if(d>1&&!C.los(D,st,{x,y},{x:nx,y:ny}))continue;out.add(C.key(nx,ny));}}return out;}
const STB={burn:'燃',bleed:'血',poison:'毒',slow:'緩',freeze:'凍',charm:'魅',blind:'盲',fear:'懼',seal:'封',taunt:'嘲',stealth:'隱',vuln:'破',brk:'甲',link:'線',regen:'生',ward:'衛',shell:'殼',might:'振',oath:'誓',echo:'狐',undying:'命',doom:'爆',pact:'契',resist:'抗'};const STBAD=['burn','bleed','poison','slow','freeze','charm','blind','fear','seal','vuln','brk','link','doom','pact'];

 const sk=pixOn&&sprKey(u);const sp=sk&&sprOf(sk);if(sp)return `<div class="u ${u.faction} spr${u.commander?' cmd':''}${u.usedAct&&u.faction==='P'?' acted':''}${extra||''}" title="${esc(u.name)}"><i class="spi ${sprCls(sk)}" style="background-image:url(${sp})"></i>${stBadges(u)}<div class="hp"><i style="width:${Math.round(100*u.hp/u.maxHp)}%"></i></div>${u.solMax?`<span class="sn">${n}</span>`:''}${ic.length?`<span class="ic">${ic.join('')}</span>`:''}</div>`;
 return `<div class="u ${u.faction}${u.commander?' cmd':''}${u.usedAct&&u.faction==='P'?' acted':''}${u.art?' img'+((D.artMap&&D.artMap[u.art])||/^(?:\.\.\/|inbox\/)/.test(u.art)?' raw':''):''}${extra||''}" title="${esc(u.name)}"${u.art?` style="background-image:url(${ART(u.art)})"`:''}>${stBadges(u)}${esc(u.glyph)}<div class="hp"><i style="width:${Math.round(100*u.hp/u.maxHp)}%"></i></div>${u.solMax?`<span class="sn">${n}</span>`:''}${ic.length?`<span class="ic">${ic.join('')}</span>`:''}</div>`;}
function visSet(S){const M=D.missions[S.missionId];if(!M||!M.fog)return null;const v=new Set();const F=M.fog;
 for(const u of C.alive(S,'P')){const r=u.unitType==='P_SCOUT'?F.scout:u.unitType==='P_LANTERN'?F.lantern:F.vision;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(Math.abs(dx)+Math.abs(dy)<=r)v.add(C.key(u.x+dx,u.y+dy));}
 for(const z of S.zones||[])for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)v.add(C.key(z.x+dx,z.y+dy));return v;}
function render(){const H=cellsHi();let h='';const warnSet=new Set((st.warn||[]).map(p=>C.key(p.x,p.y)));const VIS=visSet(st);const O=st.obj||{};const PT=new Set([...(O.tiles||[]),...(O.seals||[]),...(O.exit||[])].map(([x,y])=>C.key(x,y)).filter(k=>!(st.done||[]).includes(k)&&!(st.lit||[]).includes(k)));
 for(let y=0;y<st.h;y++)for(let x=0;x<st.w;x++){const k=C.key(x,y);const t=C.tileAt(st,x,y);const T=D.terrain[t];let cls='c '+t;
  if(C.inZone(st,x,y,'P'))cls+=' zone';if(H.reach.has(k))cls+=' reach'+(H.dash?' dash':'');if(H.threat.has(k))cls+=' threat';if(H.tgt.has(k))cls+=' tgt';if(H.ally.has(k))cls+=' ally';if(H.zsel.has(k))cls+=' zsel';if(H.zprev.has(k))cls+=' zprev';if(H.tsel===k)cls+=' tgtsel';if(warnSet.has(k))cls+=' warn';if(H.dest===k)cls+=' dest';if(PT.has(k))cls+=O.type==='defend'?' ln':' pt';if(VIS&&!VIS.has(k))cls+=' fog';
  let inner=T.glyph?`<span class="tg">${T.glyph}</span>`:'';if(warnSet.has(k))inner+='<span class="wv">⚠1</span>';if(st.gate.x===x&&st.gate.y===y)inner+=`<span class="gatec">門</span>`;
  let u=C.unitAt(st,x,y);let ghost=false;const su=selU();
  if(su&&sel.to){if(u&&u.id===su.id&&(sel.to.x!==x||sel.to.y!==y))ghost=true;if(!u&&sel.to.x===x&&sel.to.y===y)u=su;}
  if(u&&VIS&&u.faction==='E'&&!VIS.has(k))u=null;
  if(st.escort&&st.escort.status==='trapped'&&st.escort.x===x&&st.escort.y===y)inner+='<span class="rescue-mark">救</span>';if(u)inner+=token(u,ghost?' ghost':'');if(u&&u.escorting)inner+='<span class="escort-mark">護送</span>';if(u&&su&&u.faction!==su.faction){const cm=C.counterMult(D,su,u.troop);inner+=`<span class="match ${cm>1?'good':cm<1?'bad':''}">${cm>1?'剋':cm<1?'弱':'＝'}</span>`;}
  h+=`<div class="${cls}" data-x="${x}" data-y="${y}" role="button" aria-label="${T.name} ${x},${y}${u?' '+esc(u.name):''}">${inner}</div>`;}
 $('board').innerHTML=h;if(pixOn){applyPix();sprPreloadE();}setTimeout(fitInfo,0);tutDraw();

 const O2=st.obj||{type:'gate'};if(!st.gate.none){$('gb').parentElement&&($('gb').style.width=Math.round(100*st.gate.hp/st.gate.maxHp)+'%');$('gl').textContent='城門';$('gh').textContent=st.gate.hp;$('gb').parentElement.style.display='';}else{$('gb').parentElement.style.display='none';$('gl').textContent=O2.seals&&(st.lit||[]).length<O2.seals.length?'燈座':O2.type==='boss'?'目標：擊倒指揮官':O2.type==='hold'?'驛站守住':O2.type==='rescue'?'救出':O2.type==='reach'?'到對岸':O2.type==='defend'?'過橋':'剩下敵人';$('gh').textContent=O2.seals&&(st.lit||[]).length<O2.seals.length?(st.lit||[]).length+'／'+O2.seals.length:O2.type==='hold'?st.hold+'／'+O2.need:O2.type==='rescue'?(st.done||[]).length+'／'+O2.need:O2.type==='reach'?C.alive(st,'P').filter(u=>O2.tiles.some(([x,y])=>u.x===x&&u.y===y)).length+'／'+O2.need:O2.type==='defend'?(st.breach||0)+'／'+O2.max:O2.type==='rout'?C.alive(st,'E').length:(st.units.some(u=>u.commander&&u.hp>0)?'未倒':'—');}if(O2.type==='escort'){$('gl').textContent='救援';$('gh').textContent=st.escort.status==='safe'?'已撤離':st.escort.status==='escorting'?'護送中':'待解救';}$('cr').textContent='濁度 '+(st.corr||0);$('cr').style.color=st.corr>=75?'#ff8a6a':st.corr>=50?'#e8c56a':'';$('sub').textContent=MM().name+'・'+D.factions[st.faction].name;renderBar();}
function skillBtn(u){const sealed=C.sv(u,'seal')>0;return `<label class="skill-select-label">技能<select id="battleSkill" aria-label="選擇戰鬥技能" onchange="chooseBattleSkill(this.value)"><option value="">選擇技能…</option>${(u.skills||[]).map(k=>{const S=D.skills[k],cd=u.cd[k]||0,selected=sel&&sel.sk===k&&sel.mode==='skill';return `<option value="${k}" ${selected?'selected':''} ${sealed||cd?'disabled':''}>${esc(S.name)}・${practiceName(u,k)}${sealed?'〔封印〕':cd?'〔冷卻 '+cd+'〕':''}</option>`;}).join('')}</select></label>`;}

function boardFx(evs,S){S=S||st;let t=0;for(const e of evs){const tg=e.d==='GATE'?S.gate:S.units.find(v=>v.id===e.d);const at=S.units.find(v=>v.id===e.a);

function exchangeOf(evs){const i=evs.findIndex(e=>(e.t==='hit'||e.t==='miss')&&!e.counter);if(i<0)return null;const main=evs[i];const rest=evs.slice(i+1);const j=rest.findIndex(e=>(e.t==='hit'||e.t==='miss')&&!e.counter);const seg=j<0?rest:rest.slice(0,j);
 const counter=seg.find(e=>(e.t==='hit'||e.t==='miss')&&e.counter);const lossD=seg.filter(e=>e.t==='soldier'&&e.d===main.d).reduce((s,e)=>s+(e.n||0),0);const lossA=seg.filter(e=>e.t==='soldier'&&e.d===main.a).reduce((s,e)=>s+(e.n||0),0);
 return {main,counter,downD:seg.some(e=>e.t==='down'&&e.d===main.d),downA:seg.some(e=>e.t==='down'&&e.d===main.a),lossD,lossA};}

 const el=$('cut');el.style.backgroundImage=`linear-gradient(#0003,#0007),url(${ART('battle/'+btBg(before,Dd)+'.webp')})`;

 <p><b>兵種克制（×1.2／被克 ×0.85）：</b>步兵→槍兵→騎兵→步兵；弓兵→飛行兵；聖職→妖物→法術→聖職。騎兵走 3 格以上再攻擊有衝鋒 +20%。飛行兵走任何地形都只算 1，能飛過深水。</p>
 <p><b>污染與濁度：</b>污染地會往外擴散：回合結束時先出現紫框預告，隔一回合才變成污染地。我方站在污染地上，每回合會被侵蝕 1 名士兵。濁度＝污染地 ×8：50 以上敵人站在污染地上攻擊 +10%；75 以上擴散加快；100 時每回合城門 −15。青蒿的光縫修復能淨化目標四周，夜漣的燈界裡不會被污染。</p>
 <p><b>狀態：</b>燃燒／流血／中毒＝每回合結束扣士兵（可以疊，層數越多扣越多）；減速＝移動 −1；凍住／魅惑＝下一次輪到時不能行動；致盲＝命中大降；恐懼＝不能反擊、攻擊 −20%；封印＝不能用技能；嘲諷＝附近的敵人優先打它；破綻＝受到的傷害 +20%；破甲＝防禦 −30%；護衛＝受到的傷害 −30%；護盾＝先吸收傷害；再生＝每回合回一點；隱身＝不會被選為目標；連線＝被打時三成傷害傳給其他連著的。棋子左上角的小字就是身上的狀態。專屬技和奧義寫在名冊的角色頁。</p>
 <table><tr><th>職業技能</th><th>效果</th></tr>${Object.values(D.skills).filter(s=>s.kind!=='gen').map(s=>`<tr><td>${esc(s.name)}<br><span class="note">冷卻 ${s.cd}</span></td><td>${esc(s.desc)}</td></tr>`).join('')}</table>
 <table style="margin-top:8px"><tr><th>兵團被動</th><th>效果</th></tr>${Object.values(D.passives).map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.desc)}</td></tr>`).join('')}</table>
 <table style="margin-top:8px"><tr><th>地形</th><th>移動</th><th>防禦</th></tr>${tr}</table>
 <p class="note">小圖示：數字＝士兵、護＝守護、縛＝束縛、標＝標記、守＝守備。角色 Lv5 學會第二個技能。紫框 ⚠＝下回合會變化的格子；金色＝燈界。</p><button onclick="closeModal()">關閉</button>`);}
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.warn('sw',e)));

// ---------- 南門街巷 ----------
const CITY=[
 {id:'guard',name:'南門守衛',place:'門內火盆',bg:'bg_talk_gate'},
 {id:'supply',name:'補給攤主',place:'棚下貨攤',bg:'bg_talk_camp'},
 {id:'care',name:'照護者',place:'臨時醫所',bg:'bg_talk_camp'},
 {id:'resident',name:'候人的居民',place:'城牆下',bg:'bg_talk_wall'}
];
function citySquare(){const f=camp.flags;modal(`<h2>南門街巷</h2><p class="say">${f.rescueSafe?'醫所的燈還亮著。昨夜空著的那張凳子，終於有人坐了。':(camp.cleared||{}).MISSION_BC_001?'門外的聲音遠了些，門內的人才敢把沒有問完的話說出口。':'守衛把火盆往門裡挪。城外的腳步聲越來越近，街巷裡還有人沒有回家。'}</p><div class="city-cards">${CITY.map(n=>`<button class="city-person" onclick="npcVisit('${n.id}')"><span>${esc(n.name)}</span><small>${esc(n.place)}${n.id==='resident'&&f.rescueSafe&&!f.rescueReward?'・有人等你':n.id==='resident'&&!f.rescueAccepted&&(camp.cleared||{}).MISSION_BC_001?'・求助':''}</small></button>`).join('')}${f.rescueSafe?'<button class="city-person" onclick="npcVisit(\'survivor\')"><span>歸來的推車人</span><small>醫所門邊・新的線索</small></button>':''}</div><p><button class="small" onclick="storyReview()">城外紀事</button></p><h3>未歸的推車人</h3><p>${f.rescueSafe?'人已平安回城。到城牆下找等候的居民。':f.rescueAccepted?'請託已接下：到礦道旁解救推車人，並護送撤離。失敗後可以重新組隊救援。':'城牆下有人一直看著南門。'}</p>${f.rescueAccepted&&!f.rescueSafe?'<button class="pri" onclick="mid=\'MISSION_RESCUE\';council()">前往救援</button>':''}${f.rescueSafe&&!f.rescueReward?'<button class="pri" onclick="claimCityRescue()">交還平安的消息</button>':''}<p><button onclick="closeModal();drawHub()">返回據點</button></p>`);}
function npcVisit(id){const n=CITY.find(n=>n.id===id)||{id:'survivor',name:'歸來的推車人',bg:'bg_talk_camp'};const lines=TALK.cityLines(id,camp);closeModal();talk(lines.map(t=>({who:'npc',name:n.name,t})),{bg:n.bg,noPc:true},()=>{if(id==='resident'&&!camp.flags.rescueAccepted&&(camp.cleared||{}).MISSION_BC_001){modal('<h2>未歸的推車人</h2><p>礦道旁還有活人的求救聲。接下請託後，可從議事桌選擇救援。</p><p class="note">需要先解救，再護送到撤離點；一次性謝禮：補給 40、招集券 2。</p><button class="pri" onclick="acceptCityRescue()">接下請託</button> <button onclick="citySquare()">稍後再來</button>');}else citySquare();});}
function acceptCityRescue(){const r=CAMP.acceptRescue(D,camp);if(!r.ok){toastInfo(esc(r.error));return;}saveCamp();citySquare();}
function claimCityRescue(){const r=CAMP.claimRescue(D,camp);if(!r.ok)return;saveCamp();closeModal();talk([{who:'npc',name:'候人的居民',t:'我一直想，等他回來一定要罵他。現在……先讓他喝完湯吧。謝謝你。'},{who:'n',t:'凳子被搬回火盆旁。補給 +40，招集券 +2。'}],{bg:'bg_talk_gate',noPc:true},citySquare);}
function storyReview(){const L=D.region.filter(r=>r.mission&&regionOpen(r)&&TALK.battle[r.mission]);modal('<h2>城外紀事</h2><p class="note">重讀已開放地點的故事，不會改變戰況或發放獎勵。</p>'+L.map(r=>`<div class="ros" style="flex-wrap:wrap"><b>${esc(r.name)}</b><button onclick="reviewScene('${r.mission}',false)">出發前</button>${camp.cleared[r.mission]?`<button onclick="reviewScene('${r.mission}',true)">歸來後</button>`:''}</div>`).join('')+'<button onclick="citySquare()">返回街巷</button>');}
function reviewScene(m,clear){const b=TALK.battle[m],lines=clear?b.clear:b.pre;if(!lines)return;closeModal();talk(castLines(lines,camp.team),{bg:'bg_talk_camp'},storyReview);}
function rescueBtn(u){return st.escort&&st.escort.status==='trapped'&&sel&&sel.to&&C.manhattan(sel.to,st.escort)<=1?'<button class="pri" onclick="commit(\'RESCUE\')">解救（消耗行動）</button>':'';}
function traitHtml(id){const h=CAMP.heroOf(D,id);return `<h3>位階本能 <span class="rar${h.r}">${D.rarityName[h.r]}</span></h3><p class="note">同職業、同等級與星級：基礎能力 ×${D.rarityMult[h.r].toFixed(2)}。${CAMP.traitsOf(D,id).length} 項天生被動，取得後立即生效。</p>`+CAMP.traitsOf(D,id).map(t=>`<p class="trait"><b>${esc(t.name)}</b>　${esc(t.desc)}</p>`).join('');}
function heroStats(id){const c={...camp,team:[id]},u=C.createBattle(D,'MISSION_BC_001',1,{team:CAMP.teamFor(D,c)}).units[0],e=CAMP.heroEq(D,camp,id),b={};for(const k of ['hp','atk','def','mag','res','hit','eva','crit'])b[k]=(k==='hp'?u.maxHp:u[k])-Math.round(e[k]||0);return {b,e};}
function unitCard(u){const a=(D.counters[u.troop]||[]).map(k=>D.troopName[k]).join('、')||'無特定兵種';const b=Object.keys(D.counters).filter(k=>D.counters[k].includes(u.troop)).map(k=>D.troopName[k]).join('、')||'無特定兵種';return `<div class="match-panel"><b>${D.troopName[u.troop]}</b>　<span class="good">克制：${a} ×1.2</span><br><span class="bad">${b==='無特定兵種'?'沒有固定兵種不利':'攻擊 '+b+' 時 ×0.85'}</span>${u.escorting?'<br>正在護送推車人：移動 −1，請保護這支隊伍。':''}</div>`+oldUnitCard(u);}
function pvText(p,t){const h=`<div class="combat-preview"><b>${p.cm>1?'有利克制':p.cm<1?'兵種不利':'兵種相當'}</b>　一般命中傷害 <strong>${p.dmg}</strong><br>命中 ${Math.round(p.hit*100)}%・暴擊 ${Math.round(p.crit*100)}%${p.cm!==1?'・兵種倍率 ×'+p.cm:''}</div>`;return h+(p.notes.length?'<p class="note">'+esc(p.notes.join('、'))+'</p>':'')+(t&&C.sv(t,'shield')>0?'<div>目標護盾 '+t.st.shield+'，會先吸收傷害。</div>':'')+(p.counter?`<div class="bad">對方存活且仍可行動時，可能反擊約 ${p.counter.dmg}（命中 ${Math.round(p.counter.hit*100)}%）。</div>`:'<div class="good">這次攻擊不會受到直接反擊。</div>')+'<div class="note">數字為單次一般命中估值；暴擊、護盾、分攤與保命效果可能改變結果。</div>';}
function mythExchangeMenu(){modal(`<h2>燈印邀約</h2><p>每次招集留下 1 枚燈印；累積 ${D.gacha.mythExchange} 枚可指定邀請一位神秘成員。燈印永久保留，不因抽到神秘而清空。</p><p>目前燈印：${camp.mythMarks||0}</p>`+D.heroes.filter(h=>h.r===3).map(h=>`<div class="ros"><img src="${CAMP.art(h)}" alt=""><div style="flex:1"><b class="rar3">${esc(h.name)}</b><br>${camp.roster[h.id]?'已擁有；邀請後按重複取得處理':'尚未加入'}</div><button ${(camp.mythMarks||0)>=D.gacha.mythExchange?'':'disabled'} onclick="doMythExchange('${h.id}')">邀請</button></div>`).join('')+'<button onclick="recruit()">返回招集所</button>');}
function doMythExchange(id){if(!confirm('花 '+D.gacha.mythExchange+' 枚燈印邀請 '+CAMP.heroOf(D,id).name+'？'))return;const r=CAMP.exchangeMythic(D,camp,id);if(!r.ok){toastInfo(esc(r.error));return;}saveCamp();recruit();toastInfo(esc(r.results[0].name)+'：'+esc(r.results[0].note));}
function probTable(){const R=D.gacha.rates;modal(`<h2>機率、保底與完整名單</h2><p>${[3,2,1,0].map(r=>`${D.rarityName[r]} ${(R[r]*100).toFixed(1)}%`).join('・')}。同位階內每位機率相同。</p><p>開場免費選一位神秘成員，兩位之後都能招集。首次十連至少一位傳世以上；每次十連至少一位精銳以上。</p><p>連續 ${D.gacha.pity-1} 次未取得傳世以上，下一次必出傳世以上。連續 ${D.gacha.mythPity-1} 次未取得神秘，下一次必出神秘；神秘也會重置傳世以上保底。指定成員可用 ${D.gacha.mythExchange} 枚燈印邀請。</p><p>重複取得升一星（最多 ★${D.maxStar}），每星基礎能力 +${Math.round(D.starStep*100)}%；滿星改給補給 20。</p>`+[3,2,1,0].map(r=>{const L=D.heroes.filter(h=>h.r===r);return `<p><b class="rar${r}">${D.rarityName[r]}（${L.length} 人）</b>・單人基礎機率 ${(R[r]*100/L.length).toFixed(3)}%<br>${L.map(h=>esc(h.name)+(camp.roster[h.id]?' ✓':'')).join('、')}</p>`;}).join('')+'<button onclick="recruit()">返回招集所</button>');}


// ---------- 職業技能書與熟練度 ----------
function practiceName(u,k){return D.practice.names[C.masteryTier(D,u,k)];}
function practiceInfo(u,k){const n=Math.max(0,Math.min(D.practice.max,Number((u.mastery||{})[k])||0)),tier=C.masteryTier(D,u,k),boost=Math.round(D.practice.boost[tier]*100),pending=(u.practiceGain||{})[k]||0;return `<span class="practice">熟練 ${n}/${D.practice.max}・${D.practice.names[tier]}${pending?'・本場待結算 +'+pending:''}${boost?'・傷害／治療／護盾加成 '+boost+'%':''}</span>`;}
function practiceRewards(g){if(!g||!Object.keys(g).length)return '';return '<br>熟練成果：'+Object.entries(g).map(([id,L])=>esc(CAMP.heroOf(D,id).name)+' '+Object.entries(L).map(([k,n])=>esc(D.skills[k].name)+' +'+n).join('、')).join('；');}
function showAreaSkillPreview(){const u=selU();if(!u||!sel.to)return;const S=C.skillOf(D,u,sel.sk),A=C.skillAffected(D,st,u,sel.to,sel.sk,{at:sel.at,target:sel.target});let h=`<b>${esc(S.name)}</b>${A.foes.length?'・預計影響 '+A.foes.length+' 隊敵人':A.allies.length?'・影響 '+A.allies.length+' 位隊友':''}<br>${practiceInfo(u,sel.sk)}<details><summary>效果說明</summary>${esc(S.desc)}</details>`;
 if(A.foes.length){h+='<br><span class="good">預計影響 '+A.foes.length+' 隊敵人</span>';for(const t of A.foes){if(S.mult>0){let mult=S.mult;if(S.pactJudge)mult+=S.pactJudge*(t.st.pactN||0);if(S.shatter&&(C.sv(t,'slow')||C.sv(t,'freeze')))mult*=S.shatter;const p=C.preview(D,st,u,sel.to,t.id,{mult,noCounter:true,area:true,skillKey:sel.sk,useDef:S.useDef});h+='<br>'+esc(t.name)+'：每次一般命中約 '+p.dmg+'，命中 '+Math.round(p.hit*100)+'%';}else h+='<br>'+esc(t.name);}}
 else if(S.kind==='around'||S.shape==='around')h+='<br><span class="bad">範圍內沒有敵人'+(S.kind==='around'?'，不能施放':'')+'。</span>';
 if(A.allies.length){h+='<br>範圍內隊友：'+A.allies.map(t=>esc(t.name)).join('、');for(const t of A.allies){const p=C.healingForecast(D,st,u,t,sel.sk);if(p.hp||p.sol)h+='<br>'+esc(t.name)+'：生命 +'+p.hp+'、士兵生命 +'+p.sol+(p.mayDouble?'（可能額外治療）':'');}}
 if(sel.sk==='guardStance')h+='<br>相鄰隊友受擊時，由施放者分攤傷害。';
 if(sel.sk==='shadowStep')h+='<br>選紫色落點後，可攻擊或待機。';
 h+='<br><span class="note">金色為效果範圍。確認後才會消耗行動與冷卻。</span>';toastInfo(h);}
function skillStudy(id,back){const h=CAMP.heroOf(D,id),r=camp.roster[id],b=D.skillBooks[h.unit],k=b.skill,S=D.skills[k],known=(r.learned||[]).includes(k),count=(camp.skillBooks||{})[k]||0;modal(`<h2>${esc(h.name)}・職業研習</h2><p>渡鴉幣 ${camp.coins}・補給 ${camp.supply}</p><div class="book-card"><b>${esc(b.name)}</b><p class="say">${esc(b.lore)}</p><p>${esc(S.desc)}</p><p>庫存 ${count} 本・Lv${D.bookRules.minLv} 可學・${known?'已學會':'尚未研習'}</p><button class="pri" ${known||!count||r.lv<D.bookRules.minLv?'disabled':''} onclick="learnBook('${id}','${k}','${back}')">研習（消耗一本）</button> <button ${camp.coins<D.bookRules.price?'disabled':''} onclick="buyBook('${k}','${id}','${back}')">兌換（${D.bookRules.price} 渡鴉幣）</button>${count?` <button onclick="sellBook('${k}','${id}','${back}')">換補給（一本 +${D.bookRules.sellSupply}）</button>`:''}</div><p class="note">戰鬥勝利有 ${(D.bookRules.dropChance*100).toFixed(0)}% 機會掉落出戰職業技能書；每關首勝保證一本。角色專屬與神秘技能不在此列。已學會時不消耗重複書。</p><p class="note">熟練度依有效使用累積，每招每回合最多 +${D.practice.gain}、每場最多 +${D.practice.battleCap}。結算後保存，下場套用；滿級 ${D.practice.max}。階段加成 3%／6%／10%；純輔助有效施放時，自身另獲生命 1%／2%／3% 護盾。空放不累積。</p><button onclick="heroPage('${id}','${back}')">返回角色</button>`);}
function learnBook(id,k,back){const r=CAMP.bookLearn(D,camp,id,k);if(!r.ok){toastInfo(esc(r.error));return;}saveCamp();skillStudy(id,back);toastInfo('學會「'+esc(D.skills[k].name)+'」，下次出戰可使用。');}
function buyBook(k,id,back){const r=CAMP.bookBuy(D,camp,k);if(!r.ok){toastInfo(esc(r.error));return;}saveCamp();id?skillStudy(id,back):skillBookShelf();}
function sellBook(k,id,back){if(!confirm('將一本 '+CAMP.bookOf(D,k).name+' 換成 '+D.bookRules.sellSupply+' 補給？'))return;const r=CAMP.bookSell(D,camp,k);if(!r.ok){toastInfo(esc(r.error));return;}saveCamp();id?skillStudy(id,back):skillBookShelf();}
function skillBookShelf(){modal('<h2>職業技能書</h2><p>渡鴉幣 '+camp.coins+'・每本 '+D.bookRules.price+' 渡鴉幣。勝利可掉落，首勝保證一本。</p>'+Object.entries(D.skillBooks).map(([unit,b])=>{const heroes=Object.keys(camp.roster).filter(id=>CAMP.heroOf(D,id).unit===unit);return `<div class="book-card"><b>${esc(b.name)}</b> ×${(camp.skillBooks||{})[b.skill]||0}<p class="note">${esc(D.units[unit].cls)}用・${esc(D.skills[b.skill].desc)}</p><button ${camp.coins<D.bookRules.price?'disabled':''} onclick="buyBook('${b.skill}')">兌換</button> ${heroes.map(id=>`<button onclick="skillStudy('${id}','storage')">${esc(CAMP.heroOf(D,id).name)}研習</button>`).join(' ')}</div>`;}).join('')+'<button onclick="stTab=\'eq\';storage()">返回倉庫</button>');}

boot();
</script>
